<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market & Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root { 
            --blk-red: #ff0000; 
            --blk-bg: #000000; 
            --blk-card: #111111; 
            --blk-teal: #008080; 
        }
        
        body { 
            margin: 0; 
            background-color: var(--blk-bg); 
            color: #fff; 
            font-family: 'Archivo Black', sans-serif; 
            overflow-x: hidden; 
        }

        /* HERO SECTION */
        .magazine-cover {
            position: relative;
            height: 85vh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-bottom: 8px solid var(--blk-red);
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 140%; 
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%), 
                        url('./images/hero-parallax.jpg') center/cover no-repeat;
            z-index: 1;
            will-change: transform;
        }

        .cover-content {
            position: relative;
            z-index: 10;
            padding: 20px 5% 0 5%;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .masthead-logo {
            width: 100%; 
            max-width: 1400px; 
            height: auto;
            filter: drop-shadow(0 15px 40px rgba(0,0,0,1));
        }

        /* NAVIGATION */
        .market-nav {
            display: flex;
            justify-content: center;
            background: #080808;
            border-bottom: 2px solid #222;
            position: sticky; 
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            padding: 25px 40px;
            border: none;
            background: none;
            color: #444;
            font-family: 'Archivo Black', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .nav-btn:hover { color: #fff; }
        .nav-btn.active {
            color: var(--blk-red);
            border-bottom: 5px solid var(--blk-red);
            background: #000;
        }

        /* GRID SYSTEM */
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; min-height: 100vh; }
        .grid { display: none; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .grid.active { display: grid; }

        .card-link { text-decoration: none; color: inherit; display: block; height: 100%; }
        
        .card { 
            background: var(--blk-card); 
            border: 1px solid #1a1a1a; 
            transition: 0.4s; 
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .card:hover { 
            border-color: var(--blk-red); 
            transform: translateY(-10px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.8); 
        }

        .card-img { width: 100%; height: 300px; object-fit: contain; background: #000; padding: 10px; box-sizing: border-box; }
        
        .card-body { padding: 25px; flex-grow: 1; }
        .card-sku { font-size: 0.7rem; letter-spacing: 1px; margin-bottom: 8px; font-family: sans-serif; }
        .card-title { font-size: 1.1rem; line-height: 1.3; min-height: 3em; margin-bottom: 15px; }
        .price-tag { font-size: 1.6rem; color: #fff; }

        /* FOOTER */
        footer { text-align: center; padding: 60px 10%; background: #000; border-top: 1px solid #111; }
        .disclosure { font-family: sans-serif; font-size: 0.8rem; color: #777; line-height: 1.6; max-width: 700px; margin: 0 auto 30px; }
        .v-badge { color: var(--blk-teal); font-size: 1rem; letter-spacing: 5px; text-transform: uppercase; margin-top: 20px; }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            .nav-btn { padding: 20px; font-size: 0.8rem; }
            .grid { grid-template-columns: 1fr; }
            .masthead-logo { padding-top: 40px; }
        }
    </style>
</head>
<body>

    <section class="magazine-cover">
        <div class="hero-bg" id="parallax-hero"></div>
        <div class="cover-content">
            <img src="./images/BLKHDZ.png" alt="BLKHDZ" class="masthead-logo">
        </div>
    </section>

    <nav class="market-nav">
        <button class="nav-btn active" onclick="switchTab('inventory.json', this)">LEGO INVENTORY</button>
        <button class="nav-btn" onclick="switchTab('diecast.json', this)">DIECAST CARS</button>
    </nav>

    <div class="container">
        <div id="market-grid" class="grid active">
            </div>
    </div>

    <footer>
        <div class="disclosure">
            <strong>Disclosure:</strong> As an eBay Associate, BLKHDZ LLC may earn a commission from qualifying purchases. This helps support the shop at no additional cost to you.
        </div>
        <div style="font-size: 0.7rem; opacity: 0.4; letter-spacing: 3px;">&copy; 2026 BLOCKHEADZ LLC</div>
        <div class="v-badge"><strong>Veteran Owned</strong></div>
    </footer>

    <script>
        // Parallax Logic
        window.addEventListener('scroll', () => {
            const hero = document.getElementById('parallax-hero');
            hero.style.transform = `translateY(${window.pageYOffset * 0.3}px)`;
        });

        async function switchTab(fileName, el) {
            // Update UI buttons
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            const container = document.getElementById('market-grid');
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: var(--blk-red);">SCANNING DATABASE...</div>';

            try {
                const response = await fetch('data/test/' + fileName + '?v=' + Date.now());
                const data = await response.json();
                const items = data.itemSummaries || [];

                if (items.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px;">NO ACTIVE LISTINGS FOUND.</div>';
                    return;
                }

                container.innerHTML = items.map(item => {
                    const img = (item.image && item.image.imageUrl) ? item.image.imageUrl : './images/hero-parallax.jpg';
                    const price = item.price ? `$${parseFloat(item.price.value).toFixed(2)}` : 'VIEW ON EBAY';
                    // USE AFFILIATE LINK
                    const url = item.itemAffiliateWebUrl || item.itemWebUrl;
                    
                    // Determine if LEGO or Diecast for SKU color
                    const skuColor = fileName === 'inventory.json' ? 'var(--blk-red)' : 'var(--blk-teal)';
                    const skuLabel = fileName === 'inventory.json' ? 'SET' : 'SKU';

                    return `
                        <a href="${url}" target="_blank" class="card-link">
                            <div class="card">
                                <img src="${img}" class="card-img" alt="${item.title}">
                                <div class="card-body">
                                    <div class="card-sku" style="color:${skuColor}">${skuLabel} #${item.itemId.split('|')[1] || 'ACTIVE'}</div>
                                    <div class="card-title">${item.title}</div>
                                    <div class="price-tag">${price}</div>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');

            } catch (error) {
                console.error("Market Load Error:", error);
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: var(--blk-red);">ERROR LOADING ' + fileName + '</div>';
            }
        }

        // Default Load
        window.onload = () => {
            switchTab('inventory.json', document.querySelector('.nav-btn.active'));
        };
    </script>
</body>
</html>
