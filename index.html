<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Build Your Legacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --blk-red: #ff0000; --blk-bg: #000000; --blk-card: #111111; }
        
        body { margin: 0; background-color: var(--blk-bg); color: #fff; font-family: 'Syncopate', sans-serif; overflow-x: hidden; }

        /* Magazine Hero - 501st Layout */
        .hero { 
            position: relative;
            height: 95vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 60%), 
                        url('./images/hero-parallax.jpg') center/cover no-repeat;
            border-bottom: 6px solid var(--blk-red);
            padding-left: 5%;
        }

        /* Captain Rex Style Text Block */
        .hero-text-box {
            max-width: 700px;
            padding: 30px;
            /* Black background behind letters as requested */
            background: rgba(0, 0, 0, 0.7);
            border-left: 8px solid var(--blk-red);
            z-index: 10;
        }

        .legacy-title {
            font-family: 'Archivo Black', sans-serif;
            font-size: 3.5rem; /* Large Impact */
            line-height: 1;
            letter-spacing: -1px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .legacy-sub {
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #aaa;
            text-transform: uppercase;
        }

        /* Logo matched to Title Size at Bottom */
        .hero-footer {
            position: absolute;
            bottom: 50px;
            left: 5%;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .hero-logo {
            height: 80px; /* Scaled up to match text impact */
            width: auto;
        }

        /* Beefed Up Navigation Tabs */
        .tabs { 
            display: flex; 
            justify-content: center; 
            background: #0a0a0a; 
            border-bottom: 2px solid #222; 
            position: sticky; 
            top: 0; 
            z-index: 100;
        }
        .tab-btn { 
            padding: 30px 50px; /* Larger hit area */
            border: none; 
            background: none; 
            color: #777; 
            font-family: 'Archivo Black', sans-serif; 
            cursor: pointer; 
            transition: 0.3s; 
            font-size: 1rem; /* Bigger Font */
            letter-spacing: 2px;
        }
        .tab-btn:hover { color: #fff; background: #111; }
        .tab-btn.active { color: var(--blk-red); border-bottom: 4px solid var(--blk-red); background: #000; }

        /* Inventory Grid */
        .container { max-width: 1400px; margin: 0 auto; padding: 60px 20px; }
        .grid { display: none; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
        .grid.active { display: grid; }

        .card { background: var(--blk-card); border: 1px solid #1a1a1a; transition: 0.3s; }
        .card:hover { border-color: var(--blk-red); transform: translateY(-5px); }
        .card-img { width: 100%; height: 300px; object-fit: cover; }
        .card-body { padding: 30px; }
        
        .market-val { font-size: 1.6rem; font-weight: 700; color: #fff; margin: 15px 0; font-family: 'Archivo Black'; }
        .shipping-info { background: #000; padding: 15px; font-family: sans-serif; font-size: 0.75rem; color: #888; border: 1px solid #222; }

        footer { text-align: center; padding: 100px; font-size: 0.7rem; opacity: 0.4; letter-spacing: 5px; }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-text-box">
            <div class="legacy-title">LEGACY ISN'T BOUGHT.<br>IT'S BUILT.</div>
            <div class="legacy-sub">Precision for those who see the details others miss.</div>
        </div>
        
        <div class="hero-footer">
            <img src="./images/BLKHDZ.png" alt="BLKHDZ" class="hero-logo">
        </div>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" onclick="showTab('lego-grid', this)">LEGO INVENTORY</button>
        <button class="tab-btn" onclick="showTab('diecast-grid', this)">DIECAST</button>
        <button class="tab-btn" onclick="showTab('tracker-grid', this)">LEGO TRACKER</button>
    </nav>

    <div class="container">
        <div id="lego-grid" class="grid active"></div>
        <div id="diecast-grid" class="grid"></div>
        <div id="tracker-grid" class="grid">
            <p style="text-align: center; width: 100%; color: var(--blk-red); font-family: 'Archivo Black';">UPLINKING TO MARKET DATA...</p>
        </div>
    </div>

    <footer>
        &copy; 2026 BLOCKHEADZ LLC. ALL RIGHTS RESERVED.<br><br>
        <strong>VETERAN OWNED</strong>
    </footer>

    <script>
        function showTab(gridId, btn) {
            document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(gridId).classList.add('active');
            btn.classList.add('active');
        }

        async function loadData() {
            try {
                const res = await fetch('./data.json');
                const data = await res.json();
                document.getElementById('lego-grid').innerHTML = data.sets.map(set => `
                    <div class="card">
                        <img src="${set.image_url}" class="card-img" onerror="this.src='./images/hero-parallax.jpg'">
                        <div class="card-body">
                            <div style="color:var(--blk-red); font-size:0.7rem; margin-bottom:5px; font-family:'Archivo Black';">SET #${set.set_num}</div>
                            <div style="font-size:1.1rem; min-height:50px; font-family:'Archivo Black';">${set.name}</div>
                            <div class="market-val">$${set.market_value}</div>
                            <div class="shipping-info">
                                BOX: ${set.shipping_details.box_dimensions} | WT: ${set.shipping_details.weight_lbs} LBS
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error("Syncing..."); }
        }
        window.onload = loadData;
    </script>
</body>
</html>
