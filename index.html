<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Market Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; }
        header { text-align: center; margin-bottom: 40px; }
        #last-updated { font-size: 0.9em; color: #666; margin-top: 10px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; text-align: center; }
        .card:hover { transform: translateY(-5px); }
        .card img { max-width: 100%; height: 200px; object-fit: contain; border-radius: 8px; }
        
        .set-num { font-size: 0.85em; color: #888; margin: 10px 0 5px; }
        .set-name { font-weight: bold; font-size: 1.1em; height: 3em; display: flex; align-items: center; justify-content: center; }
        .price { font-size: 1.4em; color: #2c3e50; font-weight: bold; margin: 15px 0; }
        
        .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .btn:hover { background: #0056b3; }
        
        #loading-message { text-align: center; padding: 50px; font-size: 1.2em; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LEGO Market Tracker</h1>
        <div id="last-updated">Checking for latest data...</div>
    </header>

    <div id="loading-message">Initializing market data... please wait.</div>
    <div id="set-grid" class="grid"></div>
</div>

<script>
    async function loadMarketData() {
        const grid = document.getElementById('set-grid');
        const loader = document.getElementById('loading-message');
        const updateText = document.getElementById('last-updated');

        try {
            // Fetching with cache buster to ensure 2026 data shows immediately
            const response = await fetch('data.json?v=' + Date.now());
            if (!response.ok) throw new Error("File not found");
            
            const data = await response.json();

            if (data.sets && data.sets.length > 0) {
                loader.style.display = 'none'; // Hide loading text
                updateText.innerText = "Last Updated: " + data.last_updated;
                
                grid.innerHTML = data.sets.map(set => `
                    <div class="card">
                        <div class="set-num">${set.set_num}</div>
                        <img src="${set.image_url}" alt="${set.name}" onerror="this.src='https://placehold.co/400x300?text=Image+Coming+Soon'">
                        <div class="set-name">${set.name}</div>
                        <div class="price">$${typeof set.ebay_avg_price === 'number' ? set.ebay_avg_price.toFixed(2) : set.ebay_avg_price}</div>
                        <a href="${set.ebay_link}" target="_blank" class="btn">View on eBay</a>
                    </div>
                `).join('');
            } else {
                loader.innerText = "No sets found in data file.";
            }
        } catch (error) {
            console.error("Error:", error);
            loader.innerText = "Updating market values... refresh in 30 seconds.";
        }
    }

    // Run on page load
    loadMarketData();
</script>

</body>
</html>
