<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #FFD700; --teal: #008080; --dark-bg: #000; --card-bg: #080808; }
        body { background-color: var(--dark-bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; scroll-behavior: smooth; }
        
        /* HERO SECTION */
        .parallax-wrapper {
            height: 80vh; overflow: hidden; position: relative;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-bottom: 2px solid #111; background: #050505;
        }
        .parallax-bg {
            position: absolute; top: -10%; left: 0; width: 100%; height: 120%; 
            /* Fallback to dark gradient if hero-parallax.jpg is missing */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('hero-parallax.jpg');
            background-size: cover; background-position: center; z-index: -1; will-change: transform;
        }
        .hero-logo { width: 1200px; max-width: 85vw; height: auto; filter: drop-shadow(0 0 30px rgba(255,215,0,0.2)); z-index: 1; }

        .sub-nav {
            background: rgba(0,0,0,0.95); padding: 25px 0; display: flex; justify-content: center; gap: 40px;
            border-bottom: 1px solid #111; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .nav-btn { color: #fff; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 4px; font-family: 'Syncopate', sans-serif; transition: 0.3s; }
        .nav-btn:hover { color: var(--accent); letter-spacing: 6px; }

        .container { max-width: 1600px; margin: 0 auto; padding: 40px 20px; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-bottom: 60px; }
        
        .section-header { font-family: 'Syncopate', sans-serif; font-size: 1.2rem; letter-spacing: 8px; margin: 80px 0 40px; text-align: center; color: var(--accent); text-transform: uppercase; }

        /* CARDS */
        .set-card { background: var(--card-bg); border: 1px solid #151515; position: relative; overflow: hidden; transition: 0.4s; display: flex; flex-direction: column; border-radius: 4px; }
        .set-card:hover { border-color: var(--accent); transform: translateY(-8px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .img-wrapper { width: 100%; height: 280px; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; }
        .set-card img { max-width: 100%; max-height: 100%; object-fit: contain; transition: 0.5s; }
        .set-card:hover img { transform: scale(1.05); }
        
        .price-badge { position: absolute; top: 15px; left: 15px; background: var(--accent); color: #000; padding: 6px 12px; font-weight: 900; font-family: 'Syncopate', sans-serif; font-size: 0.8rem; z-index: 10; border-radius: 2px; }
        
        .card-content { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .set-title { font-family: 'Syncopate', sans-serif; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 20px; min-height: 2.8rem; line-height: 1.5; color: #fff; letter-spacing: 1px; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
        .action-link { text-decoration: none; text-align: center; padding: 12px 5px; font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-family: 'Syncopate', sans-serif; transition: 0.3s; border: 1px solid #222; }
        .ebay-btn { background: #111; color: #fff; }
        .amazon-btn { background: #111; color: #FF9900; }
        .store-btn { background: var(--accent); color: #000; grid-column: span 2; margin-top: 5px; border: none; font-size: 0.65rem; padding: 15px; }
        .store-btn:hover { filter: brightness(1.2); }

        footer { padding: 100px 20px; background: #000; text-align: center; border-top: 1px solid #111; }
        .vet-badge { font-family: 'Syncopate', sans-serif; font-weight: 700; letter-spacing: 10px; color: var(--teal); font-size: 0.9rem; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="parallax-wrapper">
    <div class="parallax-bg" id="parallax"></div>
    <img src="BLKHDZ.png" alt="BLKHDZ" class="hero-logo" onerror="this.style.display='none'; document.querySelector('.parallax-wrapper').innerHTML += '<h1 style=\'font-family:Syncopate; font-size:4rem; color:white;\'>BLKHDZ</h1>'">
</div>

<nav class="sub-nav">
    <a href="#inventory-section" class="nav-btn">Inventory</a>
    <a href="#watchlist-section" class="nav-btn">2026 Watchlist</a>
    <a href="#diecast-section" class="nav-btn">Diecast</a>
</nav>

<div class="container" id="inventory-section">
    <h2 class="section-header">Elite Inventory</h2>
    <div id="inventory-grid" class="grid-layout"></div>
</div>

<div class="container" id="watchlist-section">
    <h2 class="section-header">2026 Watchlist</h2>
    <div id="watchlist-grid" class="grid-layout"></div>
</div>

<div class="container" id="diecast-section">
    <h2 class="section-header">Elite Diecast</h2>
    <div id="diecast-grid" class="grid-layout"></div>
</div>

<footer>
    <div class="vet-badge">VETERAN OWNED BUSINESS</div>
    <p style="color: #444; font-size: 0.7rem; letter-spacing: 2px;">ALL RIGHTS RESERVED © 2026</p>
</footer>

<script>
    function formatPrice(val) {
        if (!val || val === "TBD") return "TBD";
        const num = parseFloat(val);
        return isNaN(num) ? val : `$${num.toFixed(2)}`;
    }

    function createCard(item, type) {
        // Logic for LEGO vs Diecast data structures
        const isLego = type === 'LEGO';
        const id = isLego ? item.set_num : item.id;
        const cleanId = id.split('-')[0];
        const price = isLego ? formatPrice(item.ebay_avg_price) : formatPrice(item.p);
        const ebayLink = isLego ? item.ebay_link : `https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(item.name)}`;
        const amazonLink = `https://www.amazon.com/s?k=${isLego ? 'LEGO' : 'Diecast'}+${cleanId}`;
        const storeLink = `https://www.ebay.com/str/blkhdz?_nkw=${cleanId}`;
        const image = isLego ? item.image_url : item.img;

        return `
            <div class="set-card">
                <div class="price-badge">${price}</div>
                <div class="img-wrapper">
                    <img src="${image}" alt="${item.name}" onerror="this.src='https://placehold.co/400x300/111/white?text=Image+Loading...'">
                </div>
                <div class="card-content">
                    <div class="set-title">${item.name}</div>
                    <div class="btn-group">
                        <a href="${ebayLink}" target="_blank" class="action-link ebay-btn">Market Data</a>
                        <a href="${amazonLink}" target="_blank" class="action-link amazon-btn">Amazon</a>
                        <a href="${storeLink}" target="_blank" class="action-link store-btn">Acquire from BLKHDZ</a>
                    </div>
                </div>
            </div>`;
    }

    async function initMarket() {
        try {
            const [legoRes, diecastRes] = await Promise.all([
                fetch('data.json?v=' + Date.now()),
                fetch('diecast.json?v=' + Date.now())
            ]);

            const legoData = await legoRes.json();
            const diecastData = await diecastRes.json();
            
            // Your tracker.py puts lego sets inside a "sets" property
            if (legoData.sets) {
                legoData.sets.forEach((item, index) => {
                    const targetGrid = index < 9 ? 'inventory-grid' : 'watchlist-grid';
                    document.getElementById(targetGrid).innerHTML += createCard(item, 'LEGO');
                });
            }

            if (diecastData) {
                diecastData.forEach(car => {
                    document.getElementById('diecast-grid').innerHTML += createCard(car, 'DIECAST');
                });
            }
        } catch (e) {
            console.error(e);
            document.querySelectorAll('.grid-layout').forEach(grid => {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--accent);">Syncing Live Market Data...</p>`;
            });
        }
    }

    window.addEventListener('scroll', () => {
        const scrolled = window.pageYOffset;
        const bg = document.getElementById('parallax');
        if(bg) { bg.style.transform = `translateY(${scrolled * 0.3}px)`; }
    });

    window.onload = initMarket;
</script>
</body>
</html>
