<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | The Gold Standard</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Archivo Black', sans-serif; margin: 0; padding: 0; }
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('hero-parallax.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding-bottom: 100px;
            text-align: center;
        }
        .hero h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: clamp(4rem, 15vw, 10rem); 
            margin: 0; color: #FFD700; font-style: italic; line-height: 0.8;
            text-shadow: 5px 5px 0px #e53238;
        }
        .legacy-tag { font-size: 1.2rem; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 20px; }
        .nav-buttons { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        .nav-btn { padding: 12px 20px; background: #fff; color: #000; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
        .btn-gold { background: #FFD700; }
        .btn-red { background: #e53238; color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 50px 20px; }
        #lego-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2px; background-color: #333; border: 2px solid #333; }
        .set-card { background: #000; padding: 20px; position: relative; }
        .price-badge { background: #e53238; color: #fff; padding: 5px 15px; font-size: 1.5rem; display: inline-block; margin-bottom: 10px; }
        .set-title { font-size: 1.8rem; text-transform: uppercase; margin: 10px 0; line-height: 1; height: 3.6rem; overflow: hidden; }
        .action-btns { display: flex; flex-direction: column; gap: 5px; margin-top: 20px; }
        .link-btn { background: #222; color: #fff; padding: 10px; text-align: center; text-decoration: none; font-size: 0.7rem; }
        .store-btn { background: #FFD700; color: #000; font-weight: bold; padding: 15px; text-align: center; text-decoration: none; }
        footer { padding: 100px 20px; text-align: center; border-top: 10px solid #FFD700; }
        .vet-stamp { color: #e53238; font-size: 2rem; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="hero">
    <div class="legacy-tag">Legacy is Not Given, It's Earned.</div>
    <h1>BLKHDZ</h1>
    <div class="nav-buttons">
        <a href="https://blkhdzllc.github.io/blkhdz-website/" class="nav-btn">Home</a>
        <a href="https://www.ebay.com/str/blkhdz" target="_blank" class="nav-btn btn-gold">The Main Store</a>
        <a href="https://www.ebay.com/str/blkhdz?_sacat=222" target="_blank" class="nav-btn btn-red">Shop Diecast</a>
        <a href="#market" class="nav-btn">Market Watch</a>
    </div>
</div>
<div class="container">
    <h2 id="market" style="font-size: 4rem; text-align: left; border-bottom: 5px solid #fff; margin-bottom: 40px;">THE LEDGER.</h2>
    <div id="lego-container">SCANNINING MARKET...</div>
</div>
<footer>
    <div class="vet-stamp">VETERAN OWNED</div>
    <p style="letter-spacing: 5px;">BLKHDZ LLC | EST. 2025</p>
    <p style="color: #444; font-size: 0.75rem; max-width: 600px; margin: 20px auto;">
        AFFILIATE DISCLOSURE: AS AN EBAY PARTNER AND AMAZON ASSOCIATE, WE MAY EARN FROM QUALIFYING PURCHASES.
    </p>
</footer>
<script>
    async function loadSets() {
        const container = document.getElementById('lego-container');
        try {
            const res = await fetch('data.json?t=' + new Date().getTime());
            const sets = await res.json();
            if (!sets || sets.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 50px;">Market Update in Progress...</div>';
                return;
            }
            container.innerHTML = '';
            sets.forEach(set => {
                const cleanId = set.set_num.split('-')[0];
                const card = document.createElement('div');
                card.className = 'set-card';
                const displayPrice = (typeof set.ebay_avg_price === 'number') ? `$${set.ebay_avg_price.toLocaleString()}` : 'RESEARCHING';
                card.innerHTML = `
                    <div class="price-badge">${displayPrice}</div>
                    <img src="${set.image_url}" style="width:100%; height:300px; object-fit:cover; filter: grayscale(10%);" onerror="this.src='hero-parallax.jpg'">
                    <div class="set-title">${set.name}</div>
                    <div style="color: #666; font-size: 0.8rem; margin-bottom: 10px;">SET: ${set.set_num}</div>
                    <div class="action-btns">
                        <a href="https://www.ebay.com/sch/i.html?_nkw=LEGO+${cleanId}" target="_blank" class="link-btn">EBAY MARKET</a>
                        <a href="https://www.ebay.com/str/blkhdz" target="_blank" class="store-btn">ACQUIRE FROM STORE</a>
                    </div>`;
                container.appendChild(card);
            });
        } catch(e) { container.innerHTML = 'Market Sync Offline.'; }
    }
    window.onload = loadSets;
</script>
</body>
</html>
