<script>
    function createCard(item, categoryName) {
        const cleanId = item.set_num.split('-')[0];
        const amazonLink = `https://www.amazon.com/s?k=${categoryName}+${cleanId}`;
        const storeLink = `https://www.ebay.com/str/blkhdz?_nkw=${cleanId}`;

        return `
            <div class="set-card">
                <div class="price-badge">$${item.ebay_avg_price || 'TBD'}</div>
                <div class="img-wrapper">
                    <img src="${item.image_url}" alt="${item.name}" onerror="this.src='hero-parallax.jpg'">
                </div>
                <div class="card-content">
                    <div class="set-title">${item.name}</div>
                    <div class="btn-group">
                        <a href="${item.ebay_link}" target="_blank" class="action-link ebay-btn">eBay Data</a>
                        <a href="${amazonLink}" target="_blank" class="action-link amazon-btn">Amazon</a>
                        <a href="${storeLink}" target="_blank" class="action-link store-btn">Acquire from BLKHDZ</a>
                    </div>
                </div>
            </div>`;
    }

    async function initMarket() {
        try {
            // Load LEGO and Diecast in parallel
            const [legoRes, diecastRes] = await Promise.all([
                fetch('data.json?v=' + Date.now()),
                fetch('diecast.json?v=' + Date.now())
            ]);

            const legoData = await legoRes.json();
            const diecastData = await diecastRes.json();
            
            const invGrid = document.getElementById('inventory-grid');
            const watchGrid = document.getElementById('watchlist-grid');
            const diecastGrid = document.getElementById('diecast-grid');
            
            // LEGO Split (0-8 Inventory, 9+ Watchlist)
            legoData.forEach((item, index) => {
                if(index < 9) invGrid.innerHTML += createCard(item, 'LEGO');
                else watchGrid.innerHTML += createCard(item, 'LEGO');
            });

            // Diecast Grid
            diecastData.forEach(car => {
                diecastGrid.innerHTML += createCard(car, 'Diecast');
            });

        } catch (e) { console.error("Market Load Error:", e); }
    }

    // Parallax Logic
    window.addEventListener('scroll', () => {
        const scrolled = window.pageYOffset;
        const bg = document.getElementById('parallax');
        if(bg) { bg.style.transform = `translateY(${scrolled * 0.3}px)`; }
    });

    window.onload = initMarket;
</script>
