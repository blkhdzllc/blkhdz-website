<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Elite Inventory</title>
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Inter', sans-serif; padding: 20px; line-height: 1.6; }
        .title-bar { border-left: 4px solid #ffcc00; padding-left: 15px; margin: 40px 0 20px; color: #ffcc00; text-transform: uppercase; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; padding: 20px; text-align: center; }
        .card img { max-width: 100%; height: 180px; object-fit: contain; margin-bottom: 15px; }
        .price { color: #00ff88; font-size: 1.5rem; font-weight: 800; margin-bottom: 15px; }
        .btn { display: block; background: #ffcc00; color: #000; padding: 10px; border-radius: 5px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <h2 class="title-bar">2026 Watchlist</h2>
    <div id="watchlist" class="grid"></div>

    <h2 class="title-bar">Elite LEGO Inventory</h2>
    <div id="elite" class="grid"></div>

    <h2 class="title-bar">Precision Diecast</h2>
    <div id="diecast" class="grid"></div>

    <script>
        fetch('data.json?nocache=' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
            data.forEach(item => {
                const cardHtml = `
                    <div class="card">
                        <img src="${item.image_url}">
                        <h3>${item.name}</h3>
                        <div class="price">$${item.ebay_avg_price}</div>
                        <a href="${item.ebay_link}" class="btn" target="_blank">View Market</a>
                    </div>`;
                
                if (item.set_num.includes('TW') || item.set_num.includes('SPK')) {
                    document.getElementById('diecast').innerHTML += cardHtml;
                } else if (item.name.includes('2026') || item.set_num.includes('42224')) {
                    document.getElementById('watchlist').innerHTML += cardHtml;
                } else {
                    document.getElementById('elite').innerHTML += cardHtml;
                }
            });
        });
    </script>
</body>
</html>
