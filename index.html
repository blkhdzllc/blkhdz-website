<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Inventory</title>
    <style>
        :root {
            --primary-bg: #0a0a0a;
            --card-bg: #161616;
            --accent-teal: #008080;
            --accent-green: #39ff14;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* HERO SECTION RESTORED */
        .hero {
            position: relative;
            height: 400px;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('images/hero.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 3px solid var(--accent-teal);
        }

        .hero h1 {
            font-size: 3.5rem;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 8px;
            margin: 0;
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .item-card {
            background-color: var(--card-bg);
            border: 1px solid #222;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .item-card:hover {
            border-color: var(--accent-teal);
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .item-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
        }

        .card-body h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--text-main);
            height: 2.4em; /* Keeps alignment uniform */
            overflow: hidden;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .price {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main); /* Restored to White for professionalism */
        }

        .shipping-box {
            background: #222;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-dim);
            border-left: 3px solid var(--accent-teal);
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid var(--accent-teal);
            color: var(--accent-teal);
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 20px;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background: var(--accent-teal);
            color: white;
        }

        footer {
            background: #000;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #222;
        }

        .vet-footer {
            color: var(--accent-green);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
            display: block;
        }
    </style>
</head>
<body>

<section class="hero">
    <h1>BLKHDZ</h1>
    <p>VA-EXEMPT | PREMIUM COLLECTIBLES</p>
</section>

<div class="container">
    <div class="inventory-grid" id="inventory-target">
        </div>
</div>

<footer>
    <p>&copy; 2026 BLKHDZ LLC</p>
    <a href="https://www.ebay.com/str/blkhdz" target="_blank" style="color:var(--accent-teal); text-decoration:none;">Official eBay Store</a>
    <span class="vet-footer">Veteran Owned</span>
</footer>

<script>
    async function init() {
        try {
            const res = await fetch('./data.json');
            const data = await res.json();
            const grid = document.getElementById('inventory-target');
            
            // Loop through all sets (no limit)
            data.sets.forEach(set => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
                    <img src="images/${set.set_num}.jpg" alt="${set.name}" onerror="this.src='images/placeholder.jpg'">
                    <div class="card-body">
                        <h3>${set.name}</h3>
                        <div class="price-row">
                            <span class="price">$${set.market_value}</span>
                        </div>
                        <div class="shipping-box">
                            <div><strong>Box:</strong> ${set.shipping_details.box_dimensions}</div>
                            <div><strong>Weight:</strong> ${set.shipping_details.weight_lbs} lbs</div>
                        </div>
                        <a href="https://www.ebay.com/str/blkhdz" target="_blank" class="buy-btn">CHECK AVAILABILITY</a>
                    </div>
                `;
                grid.appendChild(div);
            });
        } catch (e) {
            console.error("Load failed", e);
        }
    }
    init();
</script>

</body>
</html>
