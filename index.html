<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market & Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root { --blk-red: #ff0000; --blk-bg: #000000; --blk-card: #111111; --blk-teal: #008080; }
        body { margin: 0; background-color: var(--blk-bg); color: #fff; font-family: 'Archivo Black', sans-serif; overflow-x: hidden; }
        .magazine-cover { position: relative; height: 85vh; display: flex; flex-direction: column; overflow: hidden; border-bottom: 8px solid var(--blk-red); }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 140%; background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%), url('./images/hero-parallax.jpg') center/cover no-repeat; z-index: 1; will-change: transform; }
        .cover-content { position: relative; z-index: 10; padding: 20px 5% 0 5%; width: 100%; height: 100%; display: flex; justify-content: center; align-items: flex-start; }
        .masthead-logo { width: 100%; max-width: 1400px; height: auto; filter: drop-shadow(0 15px 40px rgba(0,0,0,1)); }
        .market-nav { display: flex; justify-content: center; background: #080808; border-bottom: 2px solid #222; position: sticky; top: 0; z-index: 100; }
        .nav-btn { padding: 30px 60px; border: none; background: none; color: #444; font-family: 'Archivo Black', sans-serif; cursor: pointer; transition: 0.3s; font-size: 1.1rem; letter-spacing: 2px; }
        .nav-btn:hover { color: #fff; }
        .nav-btn.active { color: var(--blk-red); border-bottom: 5px solid var(--blk-red); background: #000; }
        .container { max-width: 1400px; margin: 0 auto; padding: 60px 20px; min-height: 100vh; }
        .grid { display: none; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
        .grid.active { display: grid; }
        .card { background: var(--blk-card); border: 1px solid #1a1a1a; transition: 0.4s; height: 100%; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--blk-red); transform: translateY(-12px); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .card-img { width: 100%; height: 320px; object-fit: cover; }
        .price-tag { font-size: 1.8rem; padding: 0; margin: 15px 0; color: #fff; }
        .ship-data { background: #000; padding: 20px; font-family: sans-serif; font-size: 0.75rem; color: #777; border-top: 1px solid #222; margin-top: auto; }
        footer { text-align: center; padding: 80px 10%; background: #000; border-top: 1px solid #111; }
        .affiliate-disclosure { font-family: sans-serif; font-size: 0.85rem; color: #fff; line-height: 1.6; max-width: 800px; margin: 0 auto 40px auto; opacity: 0.8; }
        .footer-copyright { font-size: 0.7rem; opacity: 0.4; letter-spacing: 4px; margin-bottom: 20px; display: block; }
        .veteran-badge { color: var(--blk-teal); font-size: 1.1rem; letter-spacing: 6px; text-transform: uppercase; }
        a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>
    <section class="magazine-cover">
        <div class="hero-bg" id="parallax-hero"></div>
        <div class="cover-content"><img src="./images/BLKHDZ.png" alt="BLKHDZ" class="masthead-logo"></div>
    </section>

    <nav class="market-nav">
        <button class="nav-btn active" onclick="switchTab('lego-market', this)">LEGO INVENTORY</button>
        <button class="nav-btn" onclick="switchTab('diecast-market', this)">DIECAST CARS</button>
    </nav>

    <div class="container">
        <div id="lego-market" class="grid active"></div>
        <div id="diecast-market" class="grid"></div>
    </div>

    <footer>
        <div class="affiliate-disclosure"><strong>Disclosure:</strong> As an eBay Associate, BLKHDZ LLC may earn a commission from qualifying purchases.</div>
        <span class="footer-copyright">&copy; 2026 BLOCKHEADZ LLC.</span>
        <div class="veteran-badge"><strong>Veteran Owned</strong></div>
    </footer>

    <script>
        function switchTab(id, el) {
            document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        async function loadMarket() {
            try {
                const res = await fetch('./data.json?v=' + Date.now());
                const data = await res.json();
                
                document.getElementById('lego-market').innerHTML = data.lego.map(item => `
                    <a href="${item.url}" target="_blank">
                        <div class="card">
                            <img src="./images/${item.id}.jpg" class="card-img" onerror="this.src='./images/hero-parallax.jpg'">
                            <div style="padding:30px;">
                                <div style="color:var(--blk-red); font-size:0.75rem;">SET #${item.id}</div>
                                <div style="font-size:1.2rem; min-height:50px; margin:10px 0;">${item.name}</div>
                                <div class="price-tag">$${item.price}</div>
                            </div>
                            <div class="ship-data">${item.shipping}</div>
                        </div>
                    </a>
                `).join('');

                document.getElementById('diecast-market').innerHTML = data.diecast.map(item => `
                    <a href="${item.url}" target="_blank">
                        <div class="card">
                            <img src="./images/${item.id}.jpg" class="card-img" onerror="this.src='./images/hero-parallax.jpg'">
                            <div style="padding:30px;">
                                <div style="color:var(--blk-teal); font-size:0.75rem;">SKU: ${item.id}</div>
                                <div style="font-size:1.2rem; min-height:50px; margin:10px 0;">${item.name}</div>
                                <div class="price-tag">$${item.price}</div>
                                <div style="color:var(--blk-teal); font-size:0.8rem;">${item.status}</div>
                            </div>
                        </div>
                    </a>
                `).join('');
            } catch(e) { console.error("Sync Failure:", e); }
        }
        window.onload = loadMarket;
    </script>
</body>
</html>
