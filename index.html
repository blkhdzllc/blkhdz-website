<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --accent: #FFD700; /* Gold */
            --teal: #008080;   /* Veteran Teal */
            --bg: #000000; 
            --card: #080808; 
            --border: #1a1a1a;
        }

        /* RESET & BASE */
        * { box-sizing: border-box; }
        body { 
            background-color: var(--bg); 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* HERO SECTION - ELITE BRANDING */
        .hero {
            height: 85vh;
            min-height: 600px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 3px solid var(--border);
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 110%;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.8)), url('hero-parallax.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
            will-change: transform;
        }

        .hero-logo {
            position: relative;
            z-index: 10;
            width: 1200px;
            max-width: 90vw;
            filter: drop-shadow(0 0 50px rgba(0,0,0,0.9));
        }

        /* NAVIGATION */
        .sub-nav {
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 25px 0;
            display: flex;
            justify-content: center;
            gap: 40px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 5px;
            font-family: 'Syncopate', sans-serif;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn:hover { color: var(--accent); letter-spacing: 7px; }

        /* GRID SYSTEM */
        .container { max-width: 1600px; margin: 0 auto; padding: 60px 20px; }
        
        .section-header {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 12px;
            margin: 0 0 50px;
            text-align: center;
            color: var(--accent);
            text-transform: uppercase;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 35px;
            margin-bottom: 100px;
        }

        /* PRODUCT CARDS */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: 0.4s;
            overflow: hidden;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .price-tag {
            position: absolute;
            top: 0; left: 0;
            background: var(--accent);
            color: #000;
            padding: 10px 18px;
            font-family: 'Syncopate', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            z-index: 5;
        }

        .img-container {
            width: 100%;
            height: 320px;
            background: #fff; /* White background for set art pop */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-details { padding: 30px; flex-grow: 1; display: flex; flex-direction: column; }
        
        .title {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #fff;
            min-height: 3rem;
        }

        /* ACTION BUTTONS */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: auto;
        }

        .btn {
            text-decoration: none;
            text-align: center;
            padding: 14px 5px;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            border: 1px solid #333;
        }

        .btn-market { background: #111; color: #fff; }
        .btn-market:hover { background: #222; }
        
        .btn-amazon { background: #111; color: #FF9900; }
        .btn-amazon:hover { background: #222; }

        .btn-buy {
            grid-column: span 2;
            background: var(--accent);
            color: #000;
            border: none;
            font-weight: 900;
            font-size: 0.75rem;
            margin-top: 8px;
        }
        .btn-buy:hover { filter: brightness(1.2); }

        /* FOOTER */
        footer {
            padding: 120px 20px;
            background: #000;
            text-align: center;
            border-top: 1px solid var(--border);
        }

        .vet-badge {
            font-family: 'Syncopate', sans-serif;
            color: var(--teal);
            font-weight: 700;
            letter-spacing: 12px;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .copy { color: #444; font-size: 0.7rem; letter-spacing: 3px; }

    </style>
</head>
<body>

    <div class="hero">
        <div class="hero-bg" id="parallax"></div>
        <img src="BLKHDZ.png" alt="BLKHDZ Logo" class="hero-logo">
    </div>

    <nav class="sub-nav">
        <a href="#inventory" class="nav-btn">Inventory</a>
        <a href="#watchlist" class="nav-btn">2026 Watchlist</a>
        <a href="#diecast" class="nav-btn">Diecast</a>
    </nav>

    <div class="container" id="inventory">
        <h2 class="section-header">Elite Inventory</h2>
        <div id="grid-inventory" class="grid-layout"></div>
    </div>

    <div class="container" id="watchlist">
        <h2 class="section-header">2026 Watchlist</h2>
        <div id="grid-watchlist" class="grid-layout"></div>
    </div>

    <div class="container" id="diecast">
        <h2 class="section-header">Elite Diecast</h2>
        <div id="grid-diecast" class="grid-layout"></div>
    </div>

    <footer>
        <div class="vet-badge">VETERAN OWNED BUSINESS</div>
        <div class="copy">ALL RIGHTS RESERVED © 2026</div>
    </footer>

    <script>
        function createProductCard(data, type) {
            const isLego = type === 'LEGO';
            
            // Handle Price
            const priceVal = isLego ? data.ebay_avg_price : data.p;
            const displayPrice = (priceVal === "TBD" || !priceVal) ? "TBD" : `$${parseFloat(priceVal).toFixed(2)}`;
            
            // Handle IDs and Links
            const rawId = isLego ? data.set_num : data.id;
            const cleanId = rawId.split('-')[0];
            const imgUrl = isLego ? data.image_url : encodeURI(data.img);
            
            const marketLink = isLego ? data.ebay_link : `https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(data.name)}`;
            const amazonLink = `https://www.amazon.com/s?k=${type}+${cleanId}`;
            const shopLink = `https://www.ebay.com/str/blkhdz?_nkw=${cleanId}`;

            return `
                <div class="card">
                    <div class="price-tag">${displayPrice}</div>
                    <div class="img-container">
                        <img src="${imgUrl}" alt="${data.name}" onerror="this.src='hero-parallax.jpg'">
                    </div>
                    <div class="card-details">
                        <div class="title">${data.name}</div>
                        <div class="btn-grid">
                            <a href="${marketLink}" target="_blank" class="btn btn-market">eBay Data</a>
                            <a href="${amazonLink}" target="_blank" class="btn btn-amazon">Amazon</a>
                            <a href="${shopLink}" target="_blank" class="btn btn-buy">Acquire From BLKHDZ</a>
                        </div>
                    </div>
                </div>`;
        }

        async function syncMarket() {
            try {
                const [legoRes, diecastRes] = await Promise.all([
                    fetch('data.json?v=' + Date.now()),
                    fetch('diecast.json?v=' + Date.now())
                ]);

                const legoJson = await legoRes.json();
                const diecastJson = await diecastRes.json();

                // Process LEGO (sets are inside the "sets" key from tracker.py)
                if (legoJson.sets) {
                    legoJson.sets.forEach((set, index) => {
                        const target = index < 9 ? 'grid-inventory' : 'grid-watchlist';
                        document.getElementById(target).innerHTML += createProductCard(set, 'LEGO');
                    });
                }

                // Process Diecast
                if (diecastJson) {
                    diecastJson.forEach(car => {
                        document.getElementById('grid-diecast').innerHTML += createProductCard(car, 'Diecast');
                    });
                }

            } catch (err) {
                console.error("Market Sync Error:", err);
            }
        }

        // Parallax Effect
        window.addEventListener('scroll', () => {
            const scroll = window.pageYOffset;
            const bg = document.getElementById('parallax');
            if (bg) bg.style.transform = `translateY(${scroll * 0.4}px)`;
        });

        window.onload = syncMarket;
    </script>
</body>
</html>
