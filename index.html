<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market & Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root { 
            --blk-red: #ff0000; 
            --blk-bg: #000000; 
            --blk-card: #111111; 
            --blk-teal: #008080; 
        }
        
        body { 
            margin: 0; 
            background-color: var(--blk-bg); 
            color: #fff; 
            font-family: 'Archivo Black', sans-serif; 
            overflow-x: hidden; 
        }

        /* HERO SECTION */
        .magazine-cover {
            position: relative;
            height: 85vh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-bottom: 8px solid var(--blk-red);
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 140%; 
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%), 
                        url('./images/hero-parallax.jpg') center/cover no-repeat;
            z-index: 1;
            will-change: transform;
        }

        .cover-content {
            position: relative;
            z-index: 10;
            padding: 20px 5% 0 5%;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .masthead-logo {
            width: 100%; 
            max-width: 1400px; 
            height: auto;
            filter: drop-shadow(0 15px 40px rgba(0,0,0,1));
        }

        /* NAVIGATION */
        .market-nav {
            display: flex;
            justify-content: center;
            background: #080808;
            border-bottom: 2px solid #222;
            position: sticky; 
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            padding: 25px 40px;
            border: none;
            background: none;
            color: #444;
            font-family: 'Archivo Black', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .nav-btn:hover { color: #fff; }
        .nav-btn.active {
            color: var(--blk-red);
            border-bottom: 5px solid var(--blk-red);
            background: #000;
        }

        /* GRID SYSTEM */
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; min-height: 100vh; }
        .grid { display: none; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .grid.active { display: grid; }

        .card-link { text-decoration: none; color: inherit; display: block; height: 100%; }
        
        .card { 
            background: var(--blk-card); 
            border: 1px solid #1a1a1a; 
            transition: 0.4s; 
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .card:hover { 
            border-color: var(--blk-red); 
            transform: translateY(-10px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.8); 
        }

        .card-img { width: 100%; height: 300px; object-fit: cover; background: #000; }
        
        .card-body { padding: 25px; flex-grow: 1; }
        .card-sku { font-size: 0.7rem; letter-spacing: 1px; margin-bottom: 8px; }
        .card-title { font-size: 1.1rem; line-height: 1.3; min-height: 3em; margin-bottom: 15px; }
        .price-tag { font-size: 1.6rem; color: #fff; }
        .status-tag { font-size: 0.75rem; margin-top: 10px; color: var(--blk-teal); }

        .ship-data { 
            background: #000; 
            padding: 15px 25px; 
            font-family: sans-serif; 
            font-size: 0.7rem; 
            color: #555; 
            border-top: 1px solid #222; 
        }

        /* FOOTER */
        footer { text-align: center; padding: 60px 10%; background: #000; border-top: 1px solid #111; }
        .disclosure { font-family: sans-serif; font-size: 0.8rem; color: #777; line-height: 1.6; max-width: 700px; margin: 0 auto 30px; }
        .v-badge { color: var(--blk-teal); font-size: 1rem; letter-spacing: 5px; text-transform: uppercase; margin-top: 20px; }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            .nav-btn { padding: 20px; font-size: 0.8rem; }
            .grid { grid-template-columns: 1fr; }
            .masthead-logo { padding-top: 40px; }
        }
    </style>
</head>
<body>

    <section class="magazine-cover">
        <div class="hero-bg" id="parallax-hero"></div>
        <div class="cover-content">
            <img src="./images/BLKHDZ.png" alt="BLKHDZ" class="masthead-logo">
        </div>
    </section>

    <nav class="market-nav">
        <button class="nav-btn active" onclick="switchTab('lego-market', this)">LEGO INVENTORY</button>
        <button class="nav-btn" onclick="switchTab('diecast-market', this)">DIECAST CARS</button>
    </nav>

    <div class="container">
        <div id="lego-market" class="grid active"></div>
        <div id="diecast-market" class="grid"></div>
    </div>

    <footer>
        <div class="disclosure">
            <strong>Disclosure:</strong> As an eBay Associate, BLKHDZ LLC may earn a commission from qualifying purchases. This helps support the shop at no additional cost to you.
        </div>
        <div style="font-size: 0.7rem; opacity: 0.4; letter-spacing: 3px;">&copy; 2026 BLOCKHEADZ LLC</div>
        <div class="v-badge"><strong>Veteran Owned</strong></div>
    </footer>

    <script>
        function switchTab(id, el) {
            document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        // Parallax Logic
        window.addEventListener('scroll', () => {
            const hero = document.getElementById('parallax-hero');
            hero.style.transform = `translateY(${window.pageYOffset * 0.3}px)`;
        });

        async function initMarket() {
            try {
                const response = await fetch('./data.json?v=' + Date.now());
                const data = await response.json();

                // Render LEGO
                const legoContainer = document.getElementById('lego-market');
                legoContainer.innerHTML = data.lego.map(item => `
                    <a href="${item.url}" target="_blank" class="card-link">
                        <div class="card">
                            <img src="./images/${item.img}" class="card-img" onerror="this.src='./images/hero-parallax.jpg'">
                            <div class="card-body">
                                <div class="card-sku" style="color:var(--blk-red)">SET #${item.id}</div>
                                <div class="card-title">${item.name}</div>
                                <div class="price-tag">$${item.price}</div>
                            </div>
                            <div class="ship-data">${item.shipping}</div>
                        </div>
                    </a>
                `).join('');

                // Render Diecast
                const diecastContainer = document.getElementById('diecast-market');
                diecastContainer.innerHTML = data.diecast.map(item => `
                    <a href="${item.url}" target="_blank" class="card-link">
                        <div class="card">
                            <img src="./images/${item.img}" class="card-img" onerror="this.src='./images/hero-parallax.jpg'">
                            <div class="card-body">
                                <div class="card-sku" style="color:var(--blk-teal)">SKU: ${item.id}</div>
                                <div class="card-title">${item.name}</div>
                                <div class="price-tag">$${item.price}</div>
                                <div class="status-tag">${item.status}</div>
                            </div>
                        </div>
                    </a>
                `).join('');

            } catch (error) {
                console.error("Market Load Error:", error);
            }
        }

        window.onload = initMarket;
    </script>
</body>
</html>
