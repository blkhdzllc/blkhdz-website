<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Elite Shop</title>
    <style>
        body { background: #080808; color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        /* Restoring your Hero Assets */
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('./hero-parallax.jpg'); 
            height: 500px; background-attachment: fixed; background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center;
        }
        .logo { width: 250px; filter: drop-shadow(0 0 15px rgba(255,204,0,0.6)); }
        .section-header { border-left: 8px solid #ffcc00; padding-left: 20px; margin: 60px 20px 30px; color: #ffcc00; text-transform: uppercase; font-size: 1.8rem; letter-spacing: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; padding: 0 20px 60px; }
        .card { background: #121212; border: 1px solid #222; border-radius: 15px; padding: 30px; text-align: center; transition: 0.3s ease; }
        .card:hover { border-color: #ffcc00; transform: translateY(-10px); }
        .card img { width: 100%; height: 240px; object-fit: contain; margin-bottom: 20px; border-radius: 10px; background: #fff; }
        .price { color: #00ff88; font-size: 2.2rem; font-weight: 900; margin: 15px 0; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        .btn { padding: 16px; border-radius: 8px; text-decoration: none; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .btn-ebay { background: #0053d6; color: white; }
        .btn-amazon { background: #ff9900; color: black; }
    </style>
</head>
<body>

    <div class="hero">
        <img src="./blkhdz.png" alt="BLKHDZ" class="logo">
    </div>

    <h2 class="section-header">2026 Watchlist</h2>
    <div id="watchlist-grid" class="grid"></div>

    <h2 class="section-header">Elite LEGO Inventory</h2>
    <div id="elite-grid" class="grid"></div>

    <h2 class="section-header">Precision Diecast</h2>
    <div id="diecast-grid" class="grid"></div>

    <script>
        fetch('data.json?v=' + Date.now())
        .then(res => res.json())
        .then(data => {
            data.forEach(item => {
                const card = `
                    <div class="card">
                        <img src="${item.image_url}" onerror="this.src='./placeholder.jpg'">
                        <h3>${item.name}</h3>
                        <div class="price">$${item.ebay_avg_price}</div>
                        <div class="btn-group">
                            <a href="${item.ebay_link}" class="btn btn-ebay" target="_blank">View on eBay</a>
                            <a href="https://www.amazon.com/s?k=LEGO+${item.set_num}" class="btn btn-amazon" target="_blank">View on Amazon</a>
                        </div>
                    </div>`;
                
                if (item.type === '2026') document.getElementById('watchlist-grid').innerHTML += card;
                else if (item.type === 'diecast') document.getElementById('diecast-grid').innerHTML += card;
                else document.getElementById('elite-grid').innerHTML += card;
            });
        });
    </script>
</body>
</html>
