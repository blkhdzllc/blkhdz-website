<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market & Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root { 
            --blk-red: #ff0000; 
            --blk-bg: #000000; 
            --blk-card: #111111; 
            --blk-teal: #008080; 
        }
        
        body { 
            margin: 0; background-color: var(--blk-bg); color: #fff; 
            font-family: 'Archivo Black', sans-serif; overflow-x: hidden; 
        }

        .magazine-cover {
            position: relative; height: 85vh; display: flex;
            flex-direction: column; overflow: hidden;
            border-bottom: 8px solid var(--blk-red);
        }

        .hero-bg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%), 
                        url('./images/hero-parallax.jpg') center/cover no-repeat;
            z-index: 1;
        }

        .market-nav {
            display: flex; justify-content: center; background: #080808;
            border-bottom: 2px solid #222; position: relative; z-index: 50;
            width: 100%;
        }

        .nav-btn {
            padding: 25px 40px; border: none; background: none; color: #444;
            font-family: 'Archivo Black', sans-serif; cursor: pointer;
            transition: 0.3s; font-size: 1rem; letter-spacing: 2px;
        }

        .nav-btn:hover { color: #fff; }
        .nav-btn.active { color: var(--blk-red); border-bottom: 5px solid var(--blk-red); background: #000; }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; min-height: 80vh; }
        
        #market-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem; width: 100%;
        }

        .card-link { text-decoration: none; color: inherit; display: block; height: 100%; }
        .card { 
            background: var(--blk-card); border: 1px solid #1a1a1a; 
            transition: 0.4s; height: 100%; display: flex; flex-direction: column;
        }
        .card:hover { border-color: var(--blk-red); transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.8); }
        .card-img { width: 100%; height: 300px; object-fit: contain; background: #000; padding: 10px; box-sizing: border-box; }
        .card-body { padding: 25px; flex-grow: 1; }
        .card-sku { font-size: 0.7rem; letter-spacing: 1px; margin-bottom: 8px; font-family: sans-serif; }
        .card-title { font-size: 1.1rem; line-height: 1.3; min-height: 3em; margin-bottom: 15px; }
        .price-tag { font-size: 1.6rem; color: #fff; }

        footer { text-align: center; padding: 60px 10%; background: #000; border-top: 1px solid #111; }
        .v-badge { color: var(--blk-teal); font-size: 1rem; letter-spacing: 5px; text-transform: uppercase; margin-top: 20px; }
    </style>
</head>
<body>

    <section class="magazine-cover">
        <div class="hero-bg" id="parallax-hero"></div>
    </section>

    <nav class="market-nav">
        <button class="nav-btn active" onclick="switchTab('inventory.json', this)">LEGO INVENTORY</button>
        <button class="nav-btn" onclick="switchTab('diecast.json', this)">DIECAST CARS</button>
    </nav>

    <div class="container">
        <div id="market-grid"></div>
    </div>

    <footer>
        <div class="v-badge"><strong>Veteran Owned</strong></div>
    </footer>

    <script>
        async function switchTab(fileName, el) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            const container = document.getElementById('market-grid');
            container.style.display = 'grid';
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: var(--blk-red);">SCANNING DATABASE...</div>';

            try {
                const response = await fetch('data/inventory.json?v=' + Date.now());
                const fullData = await response.json();
                
                const isLego = (fileName === 'inventory.json');
                const items = isLego ? fullData.lego : fullData.diecast;

                if (!items || items.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px;">NO ACTIVE ENTRIES IN CATEGORY.</div>';
                    return;
                }

                container.innerHTML = items.map(item => {
                    const skuColor = isLego ? 'var(--blk-red)' : 'var(--blk-teal)';
                    const skuLabel = isLego ? 'SET' : 'SKU';
                    return `
                        <a href="${item.url}" target="_blank" class="card-link">
                            <div class="card">
                                <img src="${item.img}" class="card-img" alt="${item.name}">
                                <div class="card-body">
                                    <div class="card-sku" style="color:${skuColor}">${skuLabel} #${item.id}</div>
                                    <div class="card-title">${item.name}</div>
                                    <div class="price-tag">$${item.price}</div>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (error) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: var(--blk-red);">CATALOG ENGINE FAULT</div>';
            }
        }

        window.onload = () => {
            switchTab('inventory.json', document.querySelector('.nav-btn.active'));
        };
    </script>
</body>
</html>
