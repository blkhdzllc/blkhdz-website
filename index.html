<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | The Definitive Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root { --blk-red: #ff0000; --blk-yellow: #ffcc00; --blk-bg: #000000; --blk-card: #111111; }
        
        body { margin: 0; background-color: var(--blk-bg); color: #fff; font-family: 'Archivo Black', sans-serif; overflow-x: hidden; }

        /* THE EDITORIAL STAGE */
        .magazine-cover {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-bottom: 8px solid var(--blk-red);
        }

        /* FULL-BLEED PARALLAX HERO */
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 130%; 
            background: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0) 100%), 
                        url('./images/hero-parallax.jpg') center/cover no-repeat;
            z-index: 1;
            will-change: transform;
        }

        /* MASTHEAD & CONTENT LAYER */
        .cover-content {
            position: relative;
            z-index: 10;
            padding: 40px 5%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* GQ-STYLE MASTHEAD LOGO */
        .masthead-logo {
            width: 100%; /* Spans the full content width */
            max-width: 1200px; /* Limits size on massive monitors */
            height: auto;
            margin-bottom: 50px;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,1));
        }

        /* STATEMENT POSITIONED BELOW LOGO */
        .headline-box {
            border-left: 15px solid var(--blk-yellow);
            padding-left: 35px;
            max-width: 800px;
            margin-top: 20px;
        }

        .main-headline {
            font-size: 4.8rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 25px;
            text-shadow: 4px 4px 20px rgba(0,0,0,1);
        }

        .sub-headline {
            font-size: 1.4rem;
            color: var(--blk-red);
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 2px 2px 10px rgba(0,0,0,1);
        }

        /* STICKY MEAT & POTATOES NAV */
        .market-nav {
            display: flex;
            justify-content: center;
            background: #080808;
            border-bottom: 2px solid #222;
            position: sticky; /* Locks to top on scroll */
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            padding: 30px 60px;
            border: none;
            background: none;
            color: #444;
            font-family: 'Archivo Black', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .nav-btn:hover { color: #fff; }
        .nav-btn.active {
            color: var(--blk-red);
            border-bottom: 5px solid var(--blk-red);
            background: #000;
        }

        /* DATA CONTAINER */
        .container { max-width: 1400px; margin: 0 auto; padding: 60px 20px; min-height: 100vh; }
        .grid { display: none; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
        .grid.active { display: grid; }

        .card { background: var(--blk-card); border: 1px solid #1a1a1a; transition: 0.4s; }
        .card:hover { border-color: var(--blk-red); transform: translateY(-12px); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .card-img { width: 100%; height: 320px; object-fit: cover; }
        
        .price-tag { font-size: 1.8rem; padding: 0 30px; margin: 15px 0; color: #fff; }
        .ship-data { background: #000; padding: 20px; font-family: sans-serif; font-size: 0.8rem; color: #777; border-top: 1px solid #222; }

        footer { text-align: center; padding: 120px; font-size: 0.7rem; opacity: 0.3; letter-spacing: 6px; }
    </style>
</head>
<body>

    <section class="magazine-cover">
        <div class="hero-bg" id="parallax-hero"></div>
        
        <div class="cover-content">
            <img src="./images/BLKHDZ.png" alt="BLKHDZ" class="masthead-logo">
            
            <div class="headline-box">
                <div class="main-headline">LEGACY ISN'T<br>BOUGHT.<br>IT'S BUILT.</div>
                <div class="sub-headline">Precision for those who see the details others miss.</div>
            </div>
        </div>
    </section>

    <nav class="market-nav">
        <button class="nav-btn active" onclick="switchTab('lego-market', this)">LEGO INVENTORY</button>
        <button class="nav-btn" onclick="switchTab('diecast-market', this)">DIECAST CARS</button>
        <button class="nav-btn" onclick="switchTab('tracker-market', this)">MARKET TRACKER</button>
    </nav>

    <div class="container">
        <div id="lego-market" class="grid active"></div>
        <div id="diecast-market" class="grid"></div>
        <div id="tracker-market" class="grid">
            <p style="text-align: center; width: 100%; color: var(--blk-red); letter-spacing: 5px; padding-top: 100px;">ESTABLISHING LIVE MARKET UPLINK...</p>
        </div>
    </div>

    <footer>
        &copy; 2026 BLOCKHEADZ LLC. ALL RIGHTS RESERVED.<br><br>
        <strong>VETERAN OWNED</strong>
    </footer>

    <script>
        function switchTab(id, el) {
            document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            // Smoothly jump down to the meat and potatoes
            window.scrollTo({ top: document.querySelector('.market-nav').offsetTop, behavior: 'smooth' });
        }

        // SMOOTH PARALLAX ENGINE
        window.addEventListener('scroll', function() {
            const hero = document.getElementById('parallax-hero');
            let scroll = window.pageYOffset;
            hero.style.transform = 'translateY(' + (scroll * 0.2) + 'px)';
        });

        async function loadMarket() {
            try {
                const res = await fetch('./data.json');
                const data = await res.json();
                document.getElementById('lego-market').innerHTML = data.sets.map(set => `
                    <div class="card">
                        <img src="./images/${set.set_num}.jpg" class="card-img" onerror="this.src='./images/hero-parallax.jpg'">
                        <div style="padding:30px;">
                            <div style="color:var(--blk-red); font-size:0.75rem; margin-bottom:5px; letter-spacing:1px;">SET #${set.set_num}</div>
                            <div style="font-size:1.2rem; min-height:50px; line-height:1.2;">${set.name}</div>
                            <div class="price-tag">$${set.market_value}</div>
                        </div>
                        <div class="ship-data">
                            BOX: ${set.shipping_details.box_dimensions} | WT: ${set.shipping_details.weight_lbs} LBS
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.log("Inventory Syncing..."); }
        }
        window.onload = loadMarket;
    </script>
</body>
</html>
