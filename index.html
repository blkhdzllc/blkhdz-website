<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #FFD700; --teal: #008080; --warning-red: #ff3b3b; }
        
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* FULL-SCREEN CINEMATIC HERO */
        .parallax-wrapper {
            height: 100vh; 
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #111;
        }
        
        .parallax-bg {
            position: absolute;
            top: -10%; left: 0; width: 100%; height: 120%; 
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.1)), url('hero-parallax.jpg');
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center; 
            z-index: -1;
            will-change: transform;
        }

        /* SUPREME SCALE LOGO */
        .hero-logo {
            width: 1600px; /* INCREASED FROM 1200px */
            max-width: 98vw; /* Fills nearly the entire width of the screen */
            height: auto;
            filter: drop-shadow(0 0 60px rgba(0,0,0,0.95)) drop-shadow(0 0 20px rgba(255,255,255,0.05));
            z-index: 1;
            transition: 0.5s ease-in-out;
        }

        /* NAVIGATION BAR */
        .sub-nav {
            background: #000;
            padding: 50px 0; /* More breathing room for the big brand */
            display: flex;
            justify-content: center;
            gap: 100px;
            border-bottom: 1px solid #111;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-btn { 
            color: #fff; 
            text-decoration: none; 
            font-weight: 700; 
            text-transform: uppercase; 
            font-size: 1.5rem; 
            letter-spacing: 12px; 
            font-family: 'Syncopate', sans-serif; 
            transition: 0.3s; 
        }
        .nav-btn:hover { color: var(--accent); letter-spacing: 15px; }

        /* DATA GRID */
        .main-content { position: relative; background: #000; z-index: 5; }
        .container { max-width: 1800px; margin: 0 auto; padding: 80px 60px; }
        
        #lego-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 60px; }
        
        .set-card { background: #080808; border: 1px solid #111; position: relative; overflow: hidden; transition: 0.4s; }
        .set-card:hover { border-color: var(--accent); }
        
        /* ZOOM EFFECT RESTORED */
        .img-wrapper { width: 100%; height: 450px; background: #000; overflow: hidden; }
        .set-card img { 
            width: 100%; height: 100%; object-fit: contain; padding: 30px; 
            transition: transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1); 
        }
        .set-card:hover img { transform: scale(1.15); } /* Snappy Zoom */

        .price-badge { position: absolute; top: 0; left: 0; background: var(--accent); color: #000; padding: 15px 30px; font-weight: 900; font-family: 'Syncopate', sans-serif; font-size: 1.4rem; z-index: 10; }
        .card-content { padding: 40px; }
        .set-title { font-family: 'Syncopate', sans-serif; font-size: 1.1rem; text-transform: uppercase; margin-bottom: 30px; min-height: 3.2rem; line-height: 1.5; letter-spacing: 1px; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .action-link { text-decoration: none; text-align: center; padding: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; font-family: 'Syncopate', sans-serif; transition: 0.3s; }
        .ebay-btn { background: #111; color: #fff; border: 1px solid #222; }
        .amazon-btn { background: #111; color: #FF9900; border: 1px solid #222; }
        .store-btn { background: var(--accent); color: #000; grid-column: span 2; margin-top: 10px; font-size: 0.9rem; }

        /* FOOTER */
        footer { padding: 200px 80px; background: #000; text-align: center; border-top: 1px solid #111; }
        .footer-logo { width: 600px; margin-bottom: 60px; filter: brightness(0) invert(1); }
        .vet-badge { font-family: 'Syncopate', sans-serif; font-weight: 700; letter-spacing: 12px; color: var(--teal); margin-bottom: 25px; font-size: 1.5rem; }
        .disclosure { max-width: 1000px; margin: 80px auto 0; font-size: 0.8rem; color: var(--warning-red); line-height: 2.5; text-transform: uppercase; font-weight: 900; }
    </style>
</head>
<body>

<div class="parallax-wrapper">
    <div class="parallax-bg" id="parallax"></div>
    <img src="BLKHDZ.png" alt="BLKHDZ" class="hero-logo">
</div>

<nav class="sub-nav">
    <a href="https://www.ebay.com/str/blkhdz?mkcid=1&mkrid=711-53200-19255-0&siteid=0&campid=5339141674&customid=LEGO&toolid=10001&mkevt=1" target="_blank" class="nav-btn">Inventory</a>
    <a href="#ledger-start" class="nav-btn">Tracker</a>
    <a href="https://www.ebay.com/str/blkhdz?mkcid=1&mkrid=711-53200-19255-0&siteid=0&campid=5339141674&customid=DIECAST&toolid=10001&mkevt=1" target="_blank" class="nav-btn">Diecast</a>
</nav>

<div class="main-content" id="ledger-start">
    <div class="container">
        <div id="lego-container"></div>
    </div>

    <footer>
        <img src="BLKHDZ.png" class="footer-logo">
        <div class="vet-badge">VETERAN OWNED BUSINESS</div>
        <div class="disclosure">
            AFFILIATE DISCLOSURE: BLKHDZ LLC IS A PARTICIPANT IN THE EBAY PARTNER NETWORK AND THE AMAZON SERVICES LLC ASSOCIATES PROGRAM. WE MAY EARN A COMMISSION FROM QUALIFYING PURCHASES MADE THROUGH LINKS ON THIS WEBSITE.
        </div>
    </footer>
</div>

<script>
    window.addEventListener('scroll', function() {
        const scrolled = window.pageYOffset;
        document.getElementById('parallax').style.transform = 'translateY(' + (scrolled * 0.2) + 'px)';
    });

    function getTrackedLink(mpre) {
        const base = "https://www.ebay.com/itm/123456789012?mkcid=1&mkrid=711-53200-19255-0&siteid=0&campid=5339141674&customid=LEGO&toolid=10001&mkevt=1&mpre=";
        return base + encodeURIComponent(mpre);
    }

    async function loadSets() {
        const container = document.getElementById('lego-container');
        try {
            const res = await fetch('data.json?t=' + new Date().getTime());
            const sets = await res.json();
            if (!sets) return;
            container.innerHTML = '';
            sets.forEach(set => {
                const cleanId = set.set_num.split('-')[0];
                const displayPrice = (typeof set.ebay_avg_price === 'number') ? `$${set.ebay_avg_price.toLocaleString()}` : 'PENDING';
                
                const trackedSearch = getTrackedLink(`https://www.ebay.com/sch/i.html?_nkw=LEGO+${cleanId}+new+sealed`);
                const trackedStore = "https://www.ebay.com/str/blkhdz?mkcid=1&mkrid=711-53200-19255-0&siteid=0&campid=5339141674&customid=LEGO&toolid=10001&mkevt=1";

                container.innerHTML += `
                    <div class="set-card">
                        <div class="price-badge">${displayPrice}</div>
                        <div class="img-wrapper"><img src="${set.image_url}" alt="${set.name}" onerror="this.src='hero-parallax.jpg'"></div>
                        <div class="card-content">
                            <div class="set-title">${set.name}</div>
                            <div class="btn-group">
                                <a href="${trackedSearch}" target="_blank" class="action-link ebay-btn">EBAY DATA</a>
                                <a href="https://www.amazon.com/s?k=LEGO+${cleanId}" target="_blank" class="action-link amazon-btn">AMAZON</a>
                                <a href="${trackedStore}" target="_blank" class="action-link store-btn">ACQUIRE FROM BLKHDZ</a>
                            </div>
                        </div>
                    </div>`;
            });
        } catch(e) { console.log("Feed Offline"); }
    }
    window.onload = loadSets;
</script>
</body>
</html>
