<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | The Gold Standard</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: 'Archivo Black', sans-serif; margin: 0; padding: 0; }
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('hero-parallax.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding-bottom: 80px;
            text-align: center;
        }
        /* LOGO STYLE */
        .hero-logo { width: 80%; max-width: 800px; height: auto; filter: drop-shadow(0 0 15px rgba(229, 50, 56, 0.5)); }
        
        .legacy-tag { font-size: 1.2rem; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 20px; color: #FFD700; }
        .nav-buttons { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        .nav-btn { padding: 12px 20px; background: #fff; color: #000; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
        .btn-gold { background: #FFD700; }
        .btn-red { background: #e53238; color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 50px 20px; }
        #lego-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .set-card { background: #111; padding: 20px; border: 1px solid #333; transition: transform 0.3s; }
        .set-card:hover { transform: translateY(-5px); border-color: #FFD700; }
        .price-badge { background: #e53238; color: #fff; padding: 5px 15px; font-size: 1.5rem; display: inline-block; margin-bottom: 10px; }
        .set-title { font-size: 1.5rem; text-transform: uppercase; margin: 10px 0; height: 3rem; overflow: hidden; line-height: 1.1; }
        .action-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
        .link-btn { background: #333; color: #fff; padding: 10px; text-align: center; text-decoration: none; font-size: 0.75rem; border: 1px solid #444; }
        .store-btn { background: #FFD700; color: #000; font-weight: bold; padding: 15px; text-align: center; text-decoration: none; }
        footer { padding: 100px 20px; text-align: center; border-top: 5px solid #FFD700; background: #050505; }
    </style>
</head>
<body>
<div class="hero">
    <div class="legacy-tag">Legacy is Earned.</div>
    <img src="logo.png" alt="BLKHDZ" class="hero-logo" onerror="this.style.display='none'">
    <div class="nav-buttons">
        <a href="https://blkhdzllc.github.io/blkhdz-website/" class="nav-btn">Home</a>
        <a href="https://www.ebay.com/str/blkhdz" target="_blank" class="nav-btn btn-gold">The Main Store</a>
        <a href="https://www.ebay.com/str/blkhdz?_sacat=222" target="_blank" class="nav-btn btn-red">Shop Diecast</a>
    </div>
</div>
<div class="container">
    <h2 id="market" style="font-size: 3rem; border-bottom: 4px solid #FFD700; margin-bottom: 40px; font-family: 'Playfair Display', serif; font-style: italic;">THE LEDGER.</h2>
    <div id="lego-container">INITIALIZING MARKET DATA...</div>
</div>
<footer>
    <div style="color: #e53238; font-size: 1.5rem; margin-bottom: 10px;">VETERAN OWNED BUSINESS</div>
    <p style="letter-spacing: 3px; color: #888;">BLKHDZ LLC | EST. 2025</p>
</footer>
<script>
    async function loadSets() {
        const container = document.getElementById('lego-container');
        try {
            const res = await fetch('data.json?t=' + new Date().getTime());
            const sets = await res.json();
            if (!sets || sets.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 50px;">Awaiting Data Feed...</div>';
                return;
            }
            container.innerHTML = '';
            sets.forEach(set => {
                const cleanId = set.set_num.split('-')[0];
                const card = document.createElement('div');
                card.className = 'set-card';
                // If price is TBD or researching, show a "Check Market" link instead
                const isPriceValid = typeof set.ebay_avg_price === 'number';
                const displayPrice = isPriceValid ? `$${set.ebay_avg_price.toLocaleString()}` : 'VIEW PRICE';
                
                card.innerHTML = `
                    <div class="price-badge" style="${!isPriceValid ? 'background:#444; font-size:1rem;' : ''}">${displayPrice}</div>
                    <img src="${set.image_url}" style="width:100%; height:280px; object-fit:contain; background:#000;" onerror="this.src='hero-parallax.jpg'">
                    <div class="set-title">${set.name}</div>
                    <div style="color: #FFD700; font-size: 0.7rem; margin-bottom: 15px;">REF: ${set.set_num}</div>
                    <div class="action-btns">
                        <a href="https://www.ebay.com/sch/i.html?_nkw=LEGO+${cleanId}+new+sealed&LH_Sold=1&LH_Complete=1" target="_blank" class="link-btn">MARKET ANALYSIS</a>
                        <a href="https://www.ebay.com/str/blkhdz" target="_blank" class="store-btn">BUY FROM BLKHDZ</a>
                    </div>`;
                container.appendChild(card);
            });
        } catch(e) { container.innerHTML = 'Market Sync Offline.'; }
    }
    window.onload = loadSets;
</script>
</body>
</html>
