<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #FFD700; --bg: #000; --card: #0a0a0a; --border: #1a1a1a; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .hero { height: 50vh; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid var(--border); }
        .hero-logo { width: 600px; max-width: 80vw; }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; margin-bottom: 60px; }
        .section-header { font-family: 'Syncopate', sans-serif; font-size: 1.2rem; letter-spacing: 5px; color: var(--accent); text-transform: uppercase; margin-bottom: 30px; border-left: 3px solid var(--accent); padding-left: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); transition: 0.3s; display: flex; flex-direction: column; overflow: hidden; border-radius: 4px; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .img-box { width: 100%; height: 260px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .info-box { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .set-name { font-weight: 800; font-size: 1.1rem; text-transform: uppercase; margin-bottom: 10px; min-height: 50px; }
        .market-price { font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 15px; }
        .ship-info { font-size: 0.75rem; color: #777; margin-bottom: 20px; text-transform: uppercase; border-top: 1px solid #222; padding-top: 10px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
        .shop-btn { padding: 12px 5px; text-align: center; text-decoration: none; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; border-radius: 2px; transition: 0.2s; font-family: 'Syncopate', sans-serif; }
        .ebay-btn { background: #0053a0; color: white; }
        .amazon-btn { background: #232f3e; color: #ff9900; border: 1px solid #ff9900; }
        .footer { padding: 80px; text-align: center; color: #333; font-size: 0.7rem; letter-spacing: 2px; border-top: 1px solid var(--border); background: #050505; }
    </style>
</head>
<body>
    <div class="hero"><img src="BLKHDZ.png" class="hero-logo" alt="BLKHDZ"></div>
    <div class="container">
        <h2 class="section-header">LEGO Inventory</h2>
        <div id="lego-grid" class="grid-layout"></div>
        <h2 class="section-header">Diecast Collection</h2>
        <div id="diecast-grid" class="grid-layout"></div>
    </div>
    <div class="footer">© 2026 BLKHDZ LLC | Veteran Owned</div>

    <script>
        async function loadInventory() {
            // Load LEGO
            try {
                const res = await fetch('data.json');
                const data = await res.json();
                const grid = document.getElementById('lego-grid');
                data.sets.forEach(set => {
                    const price = set.market_value || set.ebay_avg_price || 0;
                    const ebay = `https://www.ebay.com/sch/i.html?_nkw=LEGO+${set.set_num.split('-')[0]}`;
                    grid.innerHTML += createCard(set, price, ebay, "#");
                });
            } catch(e) { console.error("LEGO Error", e); }

            // Load Diecast
            try {
                const res = await fetch('diecast.json');
                const data = await res.json();
                const grid = document.getElementById('diecast-grid');
                data.items.forEach(item => {
                    const price = item.market_value || item.price || 0;
                    grid.innerHTML += createCard(item, price, item.ebay_link, item.amazon_link);
                });
            } catch(e) { console.error("Diecast Error", e); }
        }

        function createCard(item, price, ebay, amazon) {
            const ship = item.shipping_details ? `${item.shipping_details.weight_lbs} lbs | ${item.shipping_details.box_dimensions}` : 'Box Only Shipping';
            return `
                <div class="card">
                    <div class="img-box"><img src="${item.image_url}" alt="${item.name}"></div>
                    <div class="info-box">
                        <div class="set-name">${item.name}</div>
                        <div class="market-price">$${Number(price).toFixed(2)}</div>
                        <div class="ship-info">📦 ${ship}</div>
                        <div class="btn-group">
                            <a href="${ebay}" target="_blank" class="shop-btn ebay-btn">Shop eBay</a>
                            <a href="${amazon}" target="_blank" class="shop-btn amazon-btn">Amazon</a>
                        </div>
                    </div>
                </div>`;
        }
        loadInventory();
    </script>
</body>
</html>
