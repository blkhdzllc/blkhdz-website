    <style>
        :root { --blk-red: #ff0000; --blk-bg: #000000; --blk-card: #111111; --blk-teal: #008080; }
        html { font-size: 16px; }
        body { margin: 0; background-color: var(--blk-bg); color: #fff; font-family: 'Archivo Black', sans-serif; -webkit-text-size-adjust: 100%; }
        
        /* Header Video Banner & Logo Overlay */
        .header-banner-container { width: 100%; height: 280px; position: relative; overflow: hidden; border-bottom: 2px solid var(--blk-red); }
        .hero-video-banner { width: 100%; height: 100%; object-fit: cover; }
        .banner-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 0 15px; box-sizing: border-box; }
        .banner-logo { max-width: 500px; width: 85%; height: auto; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.8)); transition: 0.3s; }
        .banner-logo:hover { transform: scale(1.02); }

        .site-page { display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Navigation Buttons */
        .market-nav { display: flex; justify-content: center; flex-wrap: wrap; background: #080808; border-bottom: 2px solid var(--blk-red); padding: 12px 0; position: sticky; top: 0; z-index: 100; gap: 8px; }
        .nav-btn { padding: 14px 24px; border: none; background: none; color: #777; font-family: inherit; cursor: pointer; font-size: 1.4rem; text-transform: uppercase; transition: 0.2s; letter-spacing: 0.5px; }
        .nav-btn:hover { color: #bbb; }
        .nav-btn.active { color: var(--blk-red); border-bottom: 3px solid var(--blk-red); }
        
        .search-container { max-width: 700px; margin: 25px auto; padding: 0 20px; width: 100%; box-sizing: border-box; }
        .search-input { width: 100%; padding: 18px 22px; background: #111; border: 2px solid #333; color: white; font-family: inherit; font-size: 1.1rem; outline: none; transition: 0.3s; box-sizing: border-box; text-transform: uppercase; border-radius: 4px; }
        .search-input:focus { border-color: var(--blk-red); box-shadow: 0 0 15px rgba(255,0,0,0.3); }

        .container { max-width: 1400px; margin: 0 auto; padding: 10px 20px 60px 20px; width: 100%; box-sizing: border-box; }
        #market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
        
        .card { background: var(--blk-card); border: 1px solid #1a1a1a; padding: 20px; transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; border-radius: 6px; }
        .card:hover { border-color: var(--blk-red); transform: translateY(-5px); box-shadow: 0 10px 25px rgba(255,0,0,0.15); }
        .card-img { width: 100%; height: 260px; object-fit: contain; background: #050505; border-radius: 4px; }
        
        /* Card Titles */
        .card-body h3 { font-size: 1.4rem; margin: 18px 0 12px 0; height: 3.2em; overflow: hidden; line-height: 1.4; color: #f0f0f0; }
        
        /* Price Tags */
        .price-tag { font-size: 2.0rem; color: #fff; margin-bottom: 12px; }
        
        .buy-btn { background: var(--blk-red); color: white; text-align: center; padding: 14px; text-decoration: none; font-size: 1.0rem; display: block; border: none; cursor: pointer; font-family: inherit; margin-top: auto; border-radius: 4px; transition: background 0.2s; }
        .buy-btn:hover { background: #cc0000; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .modal.active { display: flex; }
        .modal-content { background: var(--blk-card); border: 2px solid var(--blk-red); max-width: 900px; width: 100%; padding: 30px; position: relative; max-height: 90vh; overflow-y: auto; text-align: center; box-sizing: border-box; border-radius: 8px; }
        .close-btn { position: absolute; top: 12px; right: 20px; color: var(--blk-red); font-size: 2.5rem; background: none; border: none; cursor: pointer; z-index: 10; line-height: 1; }
        .modal-img { width: 100%; max-height: 50vh; object-fit: contain; margin-bottom: 20px; background-color: var(--blk-bg); border-radius: 6px; }
        .modal-desc { width: 100%; text-align: left; margin: 25px 0; color: #ddd; font-family: sans-serif; font-size: 1.1rem; overflow-x: auto; line-height: 1.6; }
        .modal-desc * { background-color: transparent !important; color: inherit !important; }
        .buy-btn-large { background: var(--blk-red); color: white; text-align: center; padding: 16px 24px; text-decoration: none; font-size: 1.3rem; display: inline-block; border: none; cursor: pointer; font-family: inherit; margin-bottom: 15px; width: 90%; max-width: 450px; border-radius: 4px; transition: 0.2s; }
        .buy-btn-large:hover { background: #cc0000; transform: scale(1.02); }
        
        footer { text-align: center; padding: 40px 20px; border-top: 1px solid #111; color: var(--blk-teal); background: #050505; font-size: 1rem; }

        /* --- MAGAZINE ABOUT PAGE STYLE --- */
        .magazine-hero {
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center; 
            padding-left: 10%;
        }

        .magazine-hero-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('images/hero-parallax.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        .magazine-hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1;
        }

        .magazine-hero-content {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            border-left: 10px solid var(--lego-yellow);
            padding-left: 45px;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
            margin-top: 100px; 
        }
