<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | LEGO & Diecast Tracker</title>
    <style>
        :root {
            --lego-yellow: #FFD500;
            --lego-red: #E3000B;
            --lego-blue: #0055BF;
            --dark-bg: #1A1A1A;
            --card-bg: #2D2D2D;
            --text-white: #FFFFFF;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--lego-yellow); text-transform: uppercase; letter-spacing: 2px; }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border-bottom: 5px solid var(--lego-red);
            transition: transform 0.2s;
        }

        .card:hover { transform: translateY(-5px); }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 8px;
            background: #333;
        }

        .price-tag {
            font-size: 1.4em;
            color: var(--lego-yellow);
            margin: 10px 0;
            font-weight: bold;
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }

        .btn {
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            flex: 1;
            font-size: 0.9em;
        }

        .ebay-btn { background: var(--lego-blue); color: white; }
        .amz-btn { background: #FF9900; color: black; }

        @media (max-width: 600px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>BLKHDZ Inventory</h1>
    <div id="lego-container" class="container"></div>

    <script>
        async function loadData() {
            // Fetching with cache-buster to ensure fresh data
            const response = await fetch('data.json?v=' + Date.now());
            const data = await response.json();
            const container = document.getElementById('lego-container');

            container.innerHTML = data.map(item => `
                <div class="card">
                    <img src="${item.image_url}" alt="${item.name}">
                    <h3>${item.name}</h3>
                    <p>Set #${item.set_num}</p>
                    <div class="price-tag">$${item.ebay_avg_price}</div>
                    <div class="btn-group">
                        <a href="${item.ebay_link}" target="_blank" class="btn ebay-btn">EBAY DATA</a>
                        <a href="https://www.amazon.com/s?k=LEGO+${item.set_num.split('-')[0]}" target="_blank" class="btn amz-btn">AMAZON</a>
                    </div>
                </div>
            `).join('');
        }
        loadData();
    </script>
</body>
</html>
