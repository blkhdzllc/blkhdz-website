<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #FFD700; --teal: #008080; --bg: #000; --card: #080808; --border: #151515; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .hero { height: 60vh; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid var(--border); background: #000; position: relative; }
        .hero-logo { width: 800px; max-width: 90vw; z-index: 10; }
        .sub-nav { background: rgba(0,0,0,0.9); padding: 20px; display: flex; justify-content: center; gap: 30px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .nav-btn { color: #fff; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 3px; font-family: 'Syncopate', sans-serif; }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; margin-bottom: 60px; }
        .section-header { font-family: 'Syncopate', sans-serif; font-size: 1.2rem; letter-spacing: 8px; margin-bottom: 30px; color: var(--accent); text-transform: uppercase; border-left: 4px solid var(--accent); padding-left: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.3s; }
        .card:hover { border-color: var(--accent); }
        .img-box { width: 100%; height: 250px; background: #fff; padding: 15px; display: flex; align-items: center; justify-content: center; }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .info-box { padding: 20px; flex-grow: 1; }
        .set-name { font-weight: 900; font-size: 1rem; text-transform: uppercase; margin-bottom: 10px; min-height: 40px; }
        .market-price { font-size: 1.4rem; font-weight: 900; color: #fff; margin-bottom: 10px; }
        .ship-info { font-size: 0.7rem; color: #666; margin-bottom: 20px; text-transform: uppercase; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .shop-btn { padding: 10px; text-align: center; text-decoration: none; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; border-radius: 2px; transition: 0.2s; }
        .ebay-btn { background: #0076f6; color: white; }
        .amazon-btn { background: #ff9900; color: black; }
        .footer { padding: 60px; text-align: center; color: #444; font-size: 0.7rem; letter-spacing: 2px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <div class="hero"><img src="BLKHDZ.png" class="hero-logo" alt="BLKHDZ"></div>

    <div class="sub-nav">
        <a href="#lego-section" class="nav-btn">LEGO</a>
        <a href="#diecast-section" class="nav-btn">Diecast</a>
    </div>

    <div class="container">
        <h2 id="lego-section" class="section-header">LEGO Market Tracker</h2>
        <div id="lego-grid" class="grid-layout"></div>

        <h2 id="diecast-section" class="section-header">Diecast Collection</h2>
        <div id="diecast-grid" class="grid-layout"></div>
    </div>

    <div class="footer">© 2026 BLKHDZ LLC | Veteran Owned</div>

    <script>
        async function loadInventory() {
            // Load LEGO Data
            try {
                const lRes = await fetch('data.json');
                const lData = await lRes.json();
                const lGrid = document.getElementById('lego-grid');
                lData.sets.forEach(set => {
                    lGrid.innerHTML += createCard(set, `https://www.ebay.com/sch/i.html?_nkw=LEGO+${set.set_num.split('-')[0]}`, "#");
                });
            } catch(e) { console.error("Lego fail", e); }

            // Load Diecast Data
            try {
                const dRes = await fetch('diecast.json');
                const dData = await dRes.json();
                const dGrid = document.getElementById('diecast-grid');
                dData.items.forEach(item => {
                    dGrid.innerHTML += createCard(item, item.ebay_link, item.amazon_link);
                });
            } catch(e) { console.error("Diecast fail", e); }
        }

        function createCard(item, ebay, amazon) {
            return `
                <div class="card">
                    <div class="img-box"><img src="${item.image_url}" alt="${item.name}"></div>
                    <div class="info-box">
                        <div class="set-name">${item.name}</div>
                        <div class="market-price">$${(item.market_value || item.price || 0).toFixed(2)}</div>
                        <div class="ship-info">
                            ${item.shipping_details ? `${item.shipping_details.weight_lbs} lbs | ${item.shipping_details.box_dimensions}` : 'Box Shipping'}
                        </div>
                        <div class="btn-group">
                            <a href="${ebay}" target="_blank" class="shop-btn ebay-btn">eBay</a>
                            <a href="${amazon}" target="_blank" class="shop-btn amazon-btn">Amazon</a>
                        </div>
                    </div>
                </div>`;
        }
        loadInventory();
    </script>
</body>
</html>
