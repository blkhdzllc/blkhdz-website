<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Inventory</title>
    <style>
        :root {
            --primary-bg: #0a0a0a;
            --card-bg: #161616;
            --accent-teal: #008080;
            --accent-green: #39ff14;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            height: 450px;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('images/hero-parallax.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 4px solid var(--accent-teal);
        }

        .hero img.main-logo {
            max-width: 400px;
            height: auto;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-main);
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .item-card {
            background-color: var(--card-bg);
            border: 1px solid #222;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s ease;
        }

        .item-card:hover {
            border-color: var(--accent-teal);
            transform: translateY(-5px);
        }

        .item-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }

        .shipping-box {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-dim);
            border-left: 4px solid var(--accent-teal);
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--accent-teal);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 20px;
        }

        /* FOOTER & AFFILIATION */
        footer {
            background: #000;
            padding: 50px 20px;
            text-align: center;
            border-top: 1px solid #222;
        }

        .affiliation-warning {
            font-size: 0.75rem;
            color: var(--text-dim);
            max-width: 800px;
            margin: 0 auto 20px auto;
            line-height: 1.5;
        }

        .vet-footer {
            color: var(--accent-teal); /* Teal as requested */
            font-weight: bold;
            text-transform: uppercase;
            display: block;
            margin-top: 15px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<section class="hero">
    <img src="images/BLKHDZ.png" alt="BLKHDZ Logo" class="main-logo">
    <p>Premium Collectibles & Logistics</p>
</section>

<div class="container">
    <div class="inventory-grid" id="inventory-target">
        </div>
</div>

<footer>
    <div class="affiliation-warning">
        LEGO® is a trademark of the LEGO Group of companies which does not sponsor, authorize or endorse this site. 
        BLKHDZ LLC is an independent reseller. All other trademarks are the property of their respective owners.
    </div>
    <p>&copy; 2026 BLKHDZ LLC</p>
    <a href="https://www.ebay.com/str/blkhdz" target="_blank" style="color:var(--accent-teal); text-decoration:none;">Official Store</a>
    <span class="vet-footer">Veteran Owned</span>
</footer>

<script>
    async function init() {
        try {
            // Timestamp added to bypass cache and show your manual prices instantly
            const res = await fetch('./data.json?t=' + Date.now());
            const data = await res.json();
            const grid = document.getElementById('inventory-target');
            
            data.sets.forEach(set => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
                    <img src="images/${set.set_num}.jpg" alt="${set.name}" onerror="this.src='images/placeholder.jpg'">
                    <div class="card-body">
                        <h3 style="margin:0; font-size:1.1rem; height:2.5em; overflow:hidden;">${set.name}</h3>
                        <div class="price-row">
                            <span class="price">$${set.market_value}</span>
                        </div>
                        <div class="shipping-box">
                            <div><strong>Box:</strong> ${set.shipping_details.box_dimensions}</div>
                            <div><strong>Weight:</strong> ${set.shipping_details.weight_lbs} lbs</div>
                        </div>
                        <a href="https://www.ebay.com/str/blkhdz" target="_blank" class="buy-btn">BUY ON EBAY</a>
                    </div>
                `;
                grid.appendChild(div);
            });
        } catch (e) {
            console.error("Load failed", e);
        }
    }
    init();
</script>

</body>
</html>
