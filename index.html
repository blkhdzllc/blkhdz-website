<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | LEGO & Diecast Inventory</title>
    <style>
        :root {
            --primary-bg: #121212;
            --card-bg: #1e1e1e;
            --accent-teal: #008080;
            --accent-green: #39ff14;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid var(--accent-teal);
            margin-bottom: 40px;
        }

        header h1 {
            color: var(--accent-green);
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border 0.3s ease;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .item-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-teal);
        }

        .item-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #000;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-content h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .price-tag {
            font-size: 1.5rem;
            color: var(--accent-green);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .shipping-specs {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 15px;
        }

        .shipping-specs div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .buy-link {
            display: block;
            text-align: center;
            background-color: var(--accent-teal);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .buy-link:hover {
            background-color: #006666;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            border-top: 1px solid #333;
            color: var(--text-dim);
        }

        .veteran-badge {
            color: var(--accent-green);
            font-weight: bold;
            letter-spacing: 1px;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>BLKHDZ INVENTORY</h1>
    <p>Premium LEGO & Diecast Collectibles</p>
</header>

<div class="inventory-grid" id="lego-container">
    </div>

<footer>
    <p>&copy; 2026 BLKHDZ LLC. All Rights Reserved.</p>
    <a href="https://www.ebay.com/str/blkhdz" style="color: var(--accent-teal);">Visit eBay Store</a>
    <span class="veteran-badge">Veteran Owned</span>
</footer>

<script>
    async function loadInventory() {
        try {
            const response = await fetch('./data.json');
            const data = await response.json();
            const container = document.getElementById('lego-container');
            
            // This ensures EVERY set in your data.json is displayed
            data.sets.forEach(set => {
                const card = document.createElement('div');
                card.className = 'item-card';
                
                card.innerHTML = `
                    <img src="images/${set.set_num}.jpg" alt="${set.name}" onerror="this.src='images/placeholder.jpg'">
                    <div class="card-content">
                        <h3>${set.name}</h3>
                        <div class="price-tag">$${set.market_value}</div>
                        <div class="shipping-specs">
                            <div><span>Box:</span> <span>${set.shipping_details.box_dimensions}</span></div>
                            <div><span>Weight:</span> <span>${set.shipping_details.weight_lbs} lbs</span></div>
                        </div>
                        <a href="https://www.ebay.com/str/blkhdz" target="_blank" class="buy-link">View Listing</a>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (error) {
            console.error('Error loading inventory:', error);
        }
    }

    window.onload = loadInventory;
</script>

</body>
</html>
