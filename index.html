<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="fc25e61410ef0ab8" />
    <title>BLKHDZ | Official Market & Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root { 
            --blk-red: #ff0000; 
            --blk-bg: #000000; 
            --blk-card: #111111; 
            --blk-teal: #008080; 
        }
        
        body { 
            margin: 0; 
            background-color: var(--blk-bg); 
            color: #fff; 
            font-family: 'Archivo Black', sans-serif; 
            overflow-x: hidden; 
        }

        /* HERO SECTION */
        .magazine-cover {
            position: relative;
            height: 85vh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-bottom: 8px solid var(--blk-red);
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 140%; 
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%), 
                        url('./images/hero-parallax.jpg') center/cover no-repeat;
            z-index: 1;
            will-change: transform;
        }

        .cover-content {
            position: relative;
            z-index: 10;
            padding: 20px 5% 0 5%;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .masthead-logo {
            width: 100%; 
            max-width: 1400px; 
            height: auto;
            filter: drop-shadow(0 15px 40px rgba(0,0,0,1));
        }

        /* NAVIGATION */
        .market-nav {
            display: flex;
            justify-content: center;
            background: #080808;
            border-bottom: 2px solid #222;
            position: sticky; 
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            padding: 25px 40px;
            border: none;
            background: none;
            color: #444;
            font-family: 'Archivo Black', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .nav-btn:hover { color: #fff; }
        .nav-btn.active {
            color: var(--blk-red);
            border-bottom: 5px solid var(--blk-red);
            background: #000;
        }

        /* GRID SYSTEM */
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; min-height: 100vh; }
        .grid { display: none; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .grid.active { display: grid; }

        .card-clickable { cursor: pointer; display: block; height: 100%; text-decoration: none; color: inherit; }
        
        .card { 
            background: var(--blk-card); 
            border: 1px solid #1a1a1a; 
            transition: 0.4s; 
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .card:hover { 
            border-color: var(--blk-red); 
            transform: translateY(-10px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.8); 
        }

        .card-img { width: 100%; height: 300px; object-fit: contain; background: #000; padding: 10px; box-sizing: border-box; }
        
        .card-body { padding: 25px; flex-grow: 1; }
        .card-sku { font-size: 0.7rem; letter-spacing: 1px; margin-bottom: 8px; font-family: sans-serif; }
        .card-title { font-size: 1.1rem; line-height: 1.3; min-height: 3em; margin-bottom: 15px; }
        .price-tag { font-size: 1.6rem; color: #fff; }

        /* DETAILED MODAL LAYOUT */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-wrapper {
            background: #050505;
            border: 2px solid #222;
            width: 90%;
            max-width: 1000px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,1);
        }

        .modal-header {
            padding: 20px;
            background: #0a0a0a;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #fff;
            max-width: 85%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-close {
            background: none;
            border: none;
            color: #777;
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-close:hover {
            color: var(--blk-red);
        }

        .modal-scroll-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            background: #000;
        }

        /* Container styling to display raw synced HTML clean and safe */
        .injected-description-container {
            font-family: sans-serif;
            color: #ccc;
            line-height: 1.6;
        }

        .modal-footer-actions {
            padding: 20px;
            background: #0a0a0a;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-price {
            font-size: 1.8rem;
            color: #fff;
        }

        .modal-buy-btn {
            background: var(--blk-red);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-family: 'Archivo Black', sans-serif;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .modal-buy-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        /* FOOTER */
        footer { text-align: center; padding: 60px 10%; background: #000; border-top: 1px solid #111; }
        .disclosure { font-family: sans-serif; font-size: 0.8rem; color: #777; line-height: 1.6; max-width: 700px; margin: 0 auto 30px; }
        .v-badge { color: var(--blk-teal); font-size: 1rem; letter-spacing: 5px; text-transform: uppercase; margin-top: 20px; }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            .nav-btn { padding: 20px; font-size: 0.8rem; }
            .grid { grid-template-columns: 1fr; }
            .masthead-logo { padding-top: 40px; }
            .modal-wrapper { height: 95vh; width: 95%; }
            .modal-scroll-body { padding: 15px; }
            .modal-footer-actions { flex-direction: column; gap: 15px; text-align: center; }
            .modal-buy-btn { width: 100%; text-align: center; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <section class="magazine-cover">
        <div class="hero-bg" id="parallax-hero"></div>
        <div class="cover-content">
            <img src="./images/BLKHDZ.png" alt="BLKHDZ" class="masthead-logo">
        </div>
    </section>

    <nav class="market-nav">
        <button class="nav-btn active" onclick="switchTab('inventory.json', this)">BRICK COLLECTION</button>
        <button class="nav-btn" onclick="switchTab('diecast.json', this)">DIECAST CARS</button>
    </nav>

    <div class="container">
        <div id="market-grid" class="grid active"></div>
    </div>

    <div id="product-modal" class="modal-overlay" onclick="closeProductModal(event)">
        <div class="modal-wrapper" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title-text">PRODUCT DETAIL</h2>
                <button class="modal-close" onclick="closeProductModal(null)">&times;</button>
            </div>
            <div class="modal-scroll-body">
                <div id="modal-description-content" class="injected-description-container"></div>
            </div>
            <div class="modal-footer-actions">
                <div id="modal-price-text" class="modal-price">$0.00</div>
                <a id="modal-target-url" href="#" target="_blank" class="modal-buy-btn">VIEW ON EBAY</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="disclosure">
            <strong>Disclosure:</strong> As an eBay Associate, BLKHDZ LLC may earn a commission from qualifying purchases. This helps support the shop at no additional cost to you.
        </div>
        <div style="font-size: 0.7rem; opacity: 0.4; letter-spacing: 3px;">&copy; 2026 BLOCKHEADZ LLC</div>
        <div class="v-badge"><strong>Veteran Owned</strong></div>
    </footer>

    <script>
        // Global memory array to store pulled listings for lookup on-click
        let currentLoadedItems = [];

        // Parallax Logic
        window.addEventListener('scroll', () => {
            const hero = document.getElementById('parallax-hero');
            hero.style.transform = `translateY(${window.pageYOffset * 0.3}px)`;
        });

        // Open Detail View Modal
        function openProductModal(itemId) {
            const item = currentLoadedItems.find(i => i.itemId === itemId);
            if (!item) return;

            document.getElementById('modal-title-text').innerText = item.title;
            document.getElementById('modal-price-text').innerText = item.price ? `$${parseFloat(item.price.value).toFixed(2)}` : 'VIEW ON EBAY';
            document.getElementById('modal-target-url').href = item.itemAffiliateWebUrl || item.itemWebUrl;

            // Inject the custom scraped eBay HTML description directly
            const rawDescription = item.fullHtmlDescription || '<div style="text-align:center; padding:50px; color:#555;">NO DESCRIPTION DETAILS COMPILED FOR THIS ITEM.</div>';
            document.getElementById('modal-description-content').innerHTML = rawDescription;

            const modal = document.getElementById('product-modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Stop background body crawl
        }

        // Close Detail View Modal
        function closeProductModal(event) {
            if (event && event.target !== document.getElementById('product-modal')) return;
            const modal = document.getElementById('product-modal');
            modal.classList.remove('active');
            document.body.style.overflow = ''; // Restore body crawl
            document.getElementById('modal-description-content').innerHTML = ''; // Wipe content out of memory
        }

        async function switchTab(fileName, el) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');

            const container = document.getElementById('market-grid');
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px; color: var(--blk-red);">SCANNING DATABASE...</div>';

            try {
                const folder = fileName === 'inventory.json' ? 'data/brick-collection/' : 'data/diecast/';
                const response = await fetch(folder + fileName + '?v=' + Date.now());
                const data = await response.json();
                
                // Save current elements to reference globally on interaction hooks
                currentLoadedItems = data.itemSummaries || [];
                
                const oldScript = document.getElementById('dynamic-seo');
                if (oldScript) oldScript.remove();

                const schemas = currentLoadedItems
                    .map(item => item.seo_schema || (item.itemSummaries ? item.itemSummaries.map(s => s.seo_schema) : null))
                    .flat()
                    .filter(Boolean);

                if (schemas.length > 0) {
                    const fullSchema = {
                        "@context": "https://schema.org",
                        "@graph": schemas
                    };

                    const script = document.createElement('script');
                    script.id = 'dynamic-seo';
                    script.type = 'application/ld+json';
                    script.text = JSON.stringify(fullSchema);
                    document.head.appendChild(script);
                }

                if (currentLoadedItems.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 100px;">NO ACTIVE LISTINGS FOUND.</div>';
                    return;
                }

                container.innerHTML = currentLoadedItems.map(item => {
                    const img = (item.image && item.image.imageUrl) ? item.image.imageUrl : './images/hero-parallax.jpg';
                    const price = item.price ? `$${parseFloat(item.price.value).toFixed(2)}` : 'VIEW ON EBAY';
                    
                    const skuColor = fileName === 'inventory.json' ? 'var(--blk-red)' : 'var(--blk-teal)';
                    const skuLabel = fileName === 'inventory.json' ? 'SET' : 'SKU';

                    return `
                        <div class="card-clickable" onclick="openProductModal('${item.itemId}')">
                            <div class="card">
                                <img src="${img}" class="card-img" alt="${item.title}">
                                <div class="card-body">
                                    <div class="card-
