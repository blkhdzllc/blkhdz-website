<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market & Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root { --blk-red: #ff0000; --blk-bg: #000000; --blk-card: #111111; --blk-teal: #008080; }
        body { margin: 0; background-color: var(--blk-bg); color: #fff; font-family: 'Archivo Black', sans-serif; overflow-x: hidden; }
        
        .site-page { display: none; min-height: 100vh; }
        .site-page.active { display: flex; flex-direction: column; }

        .magazine-cover { position: relative; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-bottom: 8px solid var(--blk-red); }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%), url('./images/hero-parallax.jpg') center/cover no-repeat; z-index: 1; }
        .cover-content { position: relative; z-index: 10; }
        .enter-btn { background: var(--blk-red); color: #fff; border: none; padding: 20px 50px; font-family: inherit; cursor: pointer; font-size: 1.2rem; margin-top: 30px; }

        .market-nav { display: flex; justify-content: center; background: #080808; border-bottom: 2px solid #222; padding: 20px 0; }
        .nav-btn { padding: 15px 30px; border: none; background: none; color: #444; font-family: inherit; cursor: pointer; }
        .nav-btn.active { color: var(--blk-red); border-bottom: 3px solid var(--blk-red); }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        #market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
        .card { background: var(--blk-card); border: 1px solid #1a1a1a; padding: 20px; transition: 0.3s; }
        .card:hover { border-color: var(--blk-red); }
        .card-img { width: 100%; height: 250px; object-fit: contain; }
        .price-tag { font-size: 1.5rem; color: #fff; margin-top: 10px; }
        footer { text-align: center; padding: 40px; border-top: 1px solid #111; }
        .v-badge { color: var(--blk-teal); text-transform: uppercase; margin-top: 20px; }
    </style>
</head>
<body>

    <section id="page-cover" class="site-page active">
        <div class="hero-bg"></div>
        <div class="cover-content">
            <img src="./images/BLKHDZ.png" alt="BLKHDZ" style="max-width: 800px; width: 90%;">
            <button class="enter-btn" onclick="showMarket()">ENTER MARKET</button>
        </div>
    </section>

    <section id="page-market" class="site-page">
        <nav class="market-nav">
            <button class="nav-btn active" onclick="switchTab('lego', this)">LEGO</button>
            <button class="nav-btn" onclick="switchTab('diecast', this)">DIECAST</button>
        </nav>
        <div class="container">
            <div id="market-grid"></div>
        </div>
    </section>

    <script>
        function showMarket() {
            document.getElementById('page-cover').classList.remove('active');
            document.getElementById('page-market').classList.add('active');
            // Trigger load for the default category
            switchTab('lego', document.querySelector('.nav-btn'));
        }

        async function switchTab(category, el) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            
            const container = document.getElementById('market-grid');
            container.innerHTML = 'SCANNING...';
            
            try {
                // Always fetch the single unified inventory file
                const response = await fetch('data/inventory.json?v=' + Date.now());
                const fullData = await response.json();
                
                // Pull specifically from the category ('lego' or 'diecast')
                const items = fullData[category] || [];
                
                container.innerHTML = items.map(item => `
                    <a href="${item.url}" target="_blank" style="text-decoration:none; color:inherit;">
                        <div class="card">
                            <img src="${item.img}" class="card-img">
                            <div class="card-body">
                                <div>${item.name}</div>
                                <div class="price-tag">$${item.price}</div>
                            </div>
                        </div>
                    </a>
                `).join('');
            } catch (e) { 
                console.error(e);
                container.innerHTML = 'CATALOG ENGINE FAULT'; 
            }
        }
    </script>
    <footer><div class="v-badge"><strong>Veteran Owned</strong></div></footer>
</body>
</html>
