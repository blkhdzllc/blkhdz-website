<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market & Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root { --blk-red: #ff0000; --blk-bg: #000000; --blk-card: #111111; --blk-teal: #008080; }
        body { margin: 0; background-color: var(--blk-bg); color: #fff; font-family: 'Archivo Black', sans-serif; }
        .site-page { display: none; min-height: 100vh; }
        .site-page.active { display: flex; flex-direction: column; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%), url('./images/hero-parallax.jpg') center/cover no-repeat; z-index: 1; }
        .cover-content { position: relative; z-index: 10; text-align: center; padding-top: 20vh; }
        .enter-btn { background: var(--blk-red); color: #fff; border: none; padding: 20px 50px; font-family: inherit; cursor: pointer; font-size: 1.2rem; margin-top: 30px; }
        .market-nav { display: flex; justify-content: center; background: #080808; border-bottom: 2px solid var(--blk-red); padding: 20px 0; position: sticky; top: 0; z-index: 100; }
        .nav-btn { padding: 15px 30px; border: none; background: none; color: #444; font-family: inherit; cursor: pointer; font-size: 1rem; }
        .nav-btn.active { color: var(--blk-red); border-bottom: 3px solid var(--blk-red); }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        #market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
        
        .card { background: var(--blk-card); border: 1px solid #1a1a1a; padding: 20px; transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; }
        .card:hover { border-color: var(--blk-red); transform: translateY(-5px); }
        .card-img { width: 100%; height: 250px; object-fit: contain; }
        .card-body h3 { font-size: 0.9rem; margin: 15px 0; height: 3em; overflow: hidden; }
        .price-tag { font-size: 1.5rem; color: #fff; margin-bottom: 10px; }
        .buy-btn { background: var(--blk-red); color: white; text-align: center; padding: 10px; text-decoration: none; font-size: 0.8rem; display: block; border: none; cursor: pointer; font-family: inherit; }
        
        /* MODAL CSS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--blk-card); border: 2px solid var(--blk-red); max-width: 1000px; width: 95%; padding: 30px; position: relative; max-height: 90vh; overflow-y: auto; text-align: center; }
        .close-btn { position: absolute; top: 10px; right: 20px; color: var(--blk-red); font-size: 2rem; background: none; border: none; cursor: pointer; z-index: 10; }
        .modal-img { width: 100%; max-height: 400px; object-fit: contain; margin-bottom: 20px; }
        
        /* HTML Description Container CSS */
        .modal-desc { width: 100%; text-align: left; margin: 30px 0; color: #fff; font-family: sans-serif; overflow-x: auto; }
        .modal-desc img { max-width: 100%; height: auto; }
        
        .buy-btn-large { background: var(--blk-red); color: white; text-align: center; padding: 15px 20px; text-decoration: none; font-size: 1.2rem; display: inline-block; border: none; cursor: pointer; font-family: inherit; margin-bottom: 20px; width: 80%; max-width: 400px; }
        .buy-btn-large:hover { background: #cc0000; }
        
        footer { text-align: center; padding: 40px; border-top: 1px solid #111; color: var(--blk-teal); }
    </style>
</head>
<body>
    <section id="page-cover" class="site-page active">
        <div class="hero-bg"></div>
        <div class="cover-content">
            <img src="./images/BLKHDZ.png" alt="BLKHDZ" style="max-width: 600px; width: 90%;">
            <button class="enter-btn" onclick="showMarket()">ENTER MARKET</button>
        </div>
    </section>
    
    <section id="page-market" class="site-page">
        <nav class="market-nav">
            <button class="nav-btn active" onclick="switchTab('all', this)">ALL</button>
            <button class="nav-btn" onclick="switchTab('lego', this)">LEGO</button>
            <button class="nav-btn" onclick="switchTab('diecast', this)">DIECAST</button>
        </nav>
        <div class="container">
            <div id="market-grid"></div>
        </div>
    </section>

    <!-- THE POP-UP MODAL -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <img id="modal-img" class="modal-img" src="" alt="Item Image">
            <h3 id="modal-title" style="font-size: 1.5rem;"></h3>
            <div id="modal-price" class="price-tag" style="font-size: 2rem;"></div>
            
            <a id="modal-buy-btn" href="" target="_blank" class="buy-btn-large">SECURE ITEM ON EBAY</a>
            
            <hr style="border-color: #333; margin: 20px 0;">
            
            <!-- This is where the custom HTML template will be injected -->
            <div id="modal-desc" class="modal-desc"></div>
        </div>
    </div>

    <script>
        let cachedData = {}; 
        let currentDisplayItems = []; 

        async function showMarket() {
            document.getElementById('page-cover').classList.remove('active');
            document.getElementById('page-market').classList.add('active');
            await loadData();
            switchTab('all');
        }

        async function loadData() {
            if (Object.keys(cachedData).length === 0) {
                const response = await fetch('./data/inventory.json?v=' + Date.now());
                cachedData = await response.json();
            }
        }

        async function switchTab(category, el) {
            if (el) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                el.classList.add('active');
            }
            await loadData();
            
            const container = document.getElementById('market-grid');
            container.innerHTML = 'SCANNING...';
            
            if (category === 'all') {
                currentDisplayItems = [...(cachedData.lego || []), ...(cachedData.diecast || [])];
            } else if (category === 'lego') {
                currentDisplayItems = cachedData.lego || [];
            } else if (category === 'diecast') {
                currentDisplayItems = cachedData.diecast || [];
            }

            if (currentDisplayItems.length === 0) {
                container.innerHTML = '<p style="text-align:center; width:100%;">No items found in this category.</p>';
                return;
            }

            container.innerHTML = currentDisplayItems.map((item, index) => `
                <div class="card" onclick="openModal(${index})">
                    <img src="${item.image ? item.image.imageUrl : ''}" class="card-img" alt="${item.title}">
                    <div class="card-body">
                        <h3>${item.title}</h3>
                        <div class="price-tag">$${item.price ? item.price.value : '0.00'}</div>
                        <button class="buy-btn">VIEW DETAILS</button>
                    </div>
                </div>
            `).join('');
        }

        function openModal(index) {
            const item = currentDisplayItems[index];
            document.getElementById('modal-img').src = item.image ? item.image.imageUrl : '';
            document.getElementById('modal-title').innerText = item.title;
            
            document.getElementById('modal-price').innerText = '$' + (item.price ? item.price.value : '0.00');
            
            let checkoutUrl = item.itemAffiliateWebUrl || item.itemWebUrl;
            document.getElementById('modal-buy-btn').href = checkoutUrl;
            
            // Render the raw HTML template inside the modal
            let htmlDesc = item.fullHtmlDescription || '<p>Condition: ' + (item.condition || 'Not specified') + '</p>';
            document.getElementById('modal-desc').innerHTML = htmlDesc;
            
            document.getElementById('item-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('item-modal').classList.remove('active');
        }
    </script>
    <footer><strong>Veteran Owned</strong></footer>
</body>
</html>
