<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Official Market Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #FFD700; --teal: #008080; --bg: #000; --card: #080808; --border: #151515; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; scroll-behavior: smooth; }
        .hero { height: 85vh; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid var(--border); background: #000; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 120%; background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('hero-parallax.jpg') no-repeat center; background-size: cover; z-index: 1; }
        .hero-logo { width: 1200px; max-width: 90vw; z-index: 10; filter: drop-shadow(0 0 50px #000); }
        .sub-nav { background: rgba(0,0,0,0.95); padding: 25px 0; display: flex; justify-content: center; gap: 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .nav-btn { color: #fff; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 5px; font-family: 'Syncopate', sans-serif; transition: 0.3s; }
        .nav-btn:hover { color: var(--accent); letter-spacing: 7px; }
        .container { max-width: 1600px; margin: 0 auto; padding: 60px 20px; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }
        .section-header { font-family: 'Syncopate', sans-serif; font-size: 1.4rem; letter-spacing: 10px; margin: 0 0 40px; text-align: center; color: var(--accent); text-transform: uppercase; }
        .card { background: var(--card); border: 1px solid var(--border); position: relative; transition: 0.4s; display: flex; flex-direction: column; overflow: hidden; }
        .card:hover { border-color: var(--accent); transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        .img-box { width: 100%; height: 320px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .info-box { padding: 25px; flex-grow: 1; }
        .set-id { font-family: 'Syncopate', sans-serif; color: var(--accent); font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 10px; }
        .set-name { font-weight: 900; font-size: 1.1rem; line-height: 1.2; text-transform: uppercase; margin-bottom: 15px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1a1a1a; padding-top: 15px; }
        .market-price { color: #fff; font-size: 1.5rem; font-weight: 900; }
        .ship-info { font-size: 0.7rem; color: #666; text-transform: uppercase; margin-top: 10px; }
        .footer { padding: 100px 0; text-align: center; border-top: 1px solid var(--border); background: #050505; color: #444; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="hero">
        <div class="hero-bg"></div>
        <img src="BLKHDZ.png" class="hero-logo" alt="BLKHDZ">
    </div>

    <div class="sub-nav">
        <a href="#lego" class="nav-btn">LEGO Inventory</a>
        <a href="https://www.ebay.com/str/blkhdz" target="_blank" class="nav-btn">eBay Store</a>
    </div>

    <div id="lego" class="container">
        <h2 class="section-header">Live Market Tracker</h2>
        <p id="last-updated" style="text-align: center; color: #444; margin-bottom: 40px; font-size: 0.8rem;"></p>
        <div id="grid-inventory" class="grid-layout"></div>
    </div>

    <div class="footer">
        © 2026 BLKHDZ LLC | Veteran Owned
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                
                document.getElementById('last-updated').innerText = `Last Market Sync: ${data.last_updated}`;
                const grid = document.getElementById('grid-inventory');

                data.sets.forEach(set => {
                    const card = `
                        <div class="card">
                            <div class="img-box">
                                <img src="${set.image_url}" alt="${set.name}" onerror="this.src='https://via.placeholder.com/300x300?text=Image+Not+Found'">
                            </div>
                            <div class="info-box">
                                <div class="set-id">${set.set_num}</div>
                                <div class="set-name">${set.name}</div>
                                <div class="price-row">
                                    <div class="market-price">$${set.market_value.toFixed(2)}</div>
                                </div>
                                <div class="ship-info">
                                    ${set.shipping_details.method} | ${set.shipping_details.weight_lbs} lbs | ${set.shipping_details.box_dimensions}
                                </div>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            } catch (error) {
                console.error('Error loading inventory:', error);
            }
        }
        loadData();
    </script>
</body>
</html>
