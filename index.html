<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Built, Not Bought</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root { --blk-red: #ff0000; --blk-yellow: #ffcc00; --blk-bg: #000000; --blk-card: #111111; }
        
        body { margin: 0; background-color: var(--blk-bg); color: #fff; font-family: 'Archivo Black', sans-serif; overflow-x: hidden; }

        /* PARALLAX ENGINE */
        .hero { 
            position: relative;
            height: 95vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Background Fixed creates the parallax scroll effect */
            background-image: url('./images/hero-parallax.jpg');
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            border-bottom: 6px solid var(--blk-red);
            padding-left: 5%;
        }

        /* Logo Top Left - Above Text */
        .hero-logo {
            width: 450px; 
            height: auto;
            margin-bottom: 40px; /* Space between logo and statement */
            filter: drop-shadow(4px 4px 10px rgba(0,0,0,0.8));
        }

        /* Legacy Statement Styling */
        .hero-text-box {
            max-width: 800px;
            border-left: 12px solid var(--blk-yellow); 
            padding-left: 30px;
            z-index: 10;
        }

        .legacy-title {
            font-size: 4.5rem; 
            line-height: 0.95;
            color: #ffffff;
            text-transform: uppercase;
            /* Text Shadows for depth instead of grey box */
            text-shadow: 4px 4px 15px rgba(40, 40, 40, 0.9), 0px 0px 25px rgba(0,0,0,1);
            margin-bottom: 20px;
        }

        .legacy-sub {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #bbbbbb; 
            text-transform: uppercase;
            text-shadow: 2px 2px 10px rgba(0,0,0,1);
        }

        /* Navigation & Tabs */
        .tabs { 
            display: flex; justify-content: center; background: #0a0a0a; 
            border-bottom: 2px solid #222; position: sticky; top: 0; z-index: 100;
        }
        .tab-btn { 
            padding: 30px 50px; border: none; background: none; color: #555; 
            font-family: 'Archivo Black', sans-serif; cursor: pointer; transition: 0.3s; font-size: 1rem;
        }
        .tab-btn.active { color: var(--blk-red); border-bottom: 4px solid var(--blk-red); background: #000; }

        /* Inventory Layout */
        .container { max-width: 1400px; margin: 0 auto; padding: 60px 20px; background-color: var(--blk-bg); }
        .grid { display: none; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
        .grid.active { display: grid; }

        .card { background: var(--blk-card); border: 1px solid #1a1a1a; transition: 0.3s; }
        .card:hover { border-color: var(--blk-red); transform: translateY(-5px); }
        .card-img { width: 100%; height: 300px; object-fit: cover; }
        .card-body { padding: 30px; }
        
        .market-val { font-size: 1.6rem; color: #fff; margin: 15px 0; }
        .shipping-info { background: #000; padding: 15px; font-family: sans-serif; font-size: 0.75rem; color: #888; border: 1px solid #222; }

        footer { text-align: center; padding: 100px; font-size: 0.7rem; opacity: 0.4; letter-spacing: 5px; background: #000; }
    </style>
</head>
<body>

    <header class="hero">
        <img src="./images/BLKHDZ.png" alt="BLKHDZ" class="hero-logo">

        <div class="hero-text-box">
            <div class="legacy-title">LEGACY ISN'T<br>BOUGHT.<br>IT'S BUILT.</div>
            <div class="legacy-sub">Precision for those who see the details others miss.</div>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" onclick="showTab('lego-grid', this)">LEGO INVENTORY</button>
        <button class="tab-btn" onclick="showTab('diecast-grid', this)">DIECAST</button>
        <button class="tab-btn" onclick="showTab('tracker-grid', this)">LEGO TRACKER</button>
    </nav>

    <div class="container">
        <div id="lego-grid" class="grid active"></div>
        <div id="diecast-grid" class="grid"></div>
        <div id="tracker-grid" class="grid">
            <p style="text-align: center; width: 100%; color: var(--blk-red);">INITIALIZING MARKET UPLINK...</p>
        </div>
    </div>

    <footer>
        &copy; 2026 BLOCKHEADZ LLC. ALL RIGHTS RESERVED.<br><br>
        <strong>Veteran Owned</strong>
    </footer>

    <script>
        function showTab(gridId, btn) {
            document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(gridId).classList.add('active');
            btn.classList.add('active');
        }

        async function loadData() {
            try {
                const res = await fetch('./data.json');
                const data = await res.json();
                document.getElementById('lego-grid').innerHTML = data.sets.map(set => `
                    <div class="card">
                        <img src="./images/${set.set_num}.jpg" class="card-img" onerror="this.src='./images/hero-parallax.jpg'">
                        <div class="card-body">
                            <div style="color:var(--blk-red); font-size:0.7rem; margin-bottom:5px;">SET #${set.set_num}</div>
                            <div style="font-size:1.1rem; min-height:50px;">${set.name}</div>
                            <div class="market-val">$${set.market_value}</div>
                            <div class="shipping-info">
                                BOX: ${set.shipping_details.box_dimensions} | WT: ${set.shipping_details.weight_lbs} LBS
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.log("Waiting for data sync..."); }
        }
        window.onload = loadData;
    </script>
</body>
</html>
