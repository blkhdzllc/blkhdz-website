<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Built, Not Bought</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root { --blk-red: #ff0000; --blk-yellow: #ffcc00; --blk-bg: #000000; --blk-card: #111111; }
        
        body { margin: 0; background-color: var(--blk-bg); color: #fff; font-family: 'Archivo Black', sans-serif; overflow-x: hidden; }

        /* THE PARALLAX STAGE */
        .hero-wrapper {
            position: relative;
            height: 100vh;
            overflow: hidden; 
            border-bottom: 8px solid var(--blk-red);
            background-color: var(--blk-bg);
        }

        /* HERO IMAGE - Restored to large size but with room to move */
        .hero-bg {
            position: absolute;
            top: -10%;
            left: 0;
            width: 110%; /* Slightly wider than screen for parallax buffer */
            height: 120%; 
            background: url('./images/hero-parallax.jpg') center/cover no-repeat;
            z-index: 1;
            will-change: transform;
        }

        /* TITAN CONTENT - Overlays the image */
        .hero-content { 
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 5%;
            z-index: 10;
        }

        /* THE TITAN LOGO */
        .hero-logo {
            width: 850px; /* Massive scale increase */
            max-width: 95vw; 
            height: auto;
            margin-bottom: 40px;
            filter: drop-shadow(0px 15px 30px rgba(0,0,0,0.9));
        }

        .hero-text-box {
            max-width: 900px;
            border-left: 20px solid var(--blk-yellow); /* Heavier yellow bar */
            padding-left: 40px;
        }

        .legacy-title {
            font-size: 5.5rem; /* Pushed from 4.8 to 5.5 */
            line-height: 0.85;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 4px 4px 15px rgba(0, 0, 0, 1), 0px 0px 40px rgba(0,0,0,0.9);
            margin-bottom: 25px;
        }

        .legacy-sub {
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: #000000; /* Precision Black as requested */
            text-transform: uppercase;
            text-shadow: 0.5px 0.5px 1px rgba(255,255,255,0.3); /* Barely-there highlight */
        }

        /* Navigation */
        .tabs { 
            display: flex; justify-content: center; background: #080808; 
            border-bottom: 2px solid #222; position: sticky; top: 0; z-index: 100;
        }
        .tab-btn { 
            padding: 35px 60px; border: none; background: none; color: #444; 
            font-family: 'Archivo Black', sans-serif; cursor: pointer; transition: 0.3s; font-size: 1.1rem;
        }
        .tab-btn.active { color: var(--blk-red); border-bottom: 5px solid var(--blk-red); background: #000; }

        /* Inventory Layout */
        .container { max-width: 1400px; margin: 0 auto; padding: 60px 20px; position: relative; z-index: 10; background: var(--blk-bg); }
        .grid { display: none; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }
        .grid.active { display: grid; }

        .card { background: var(--blk-card); border: 1px solid #1a1a1a; transition: 0.3s; }
        .card:hover { border-color: var(--blk-red); transform: translateY(-8px); }
        .card-img { width: 100%; height: 320px; object-fit: cover; }
        
        .market-val { font-size: 1.8rem; padding: 0 30px; margin: 15px 0; color: #fff; }
        .shipping-info { background: #000; padding: 18px; font-family: sans-serif; font-size: 0.8rem; color: #888; border-top: 1px solid #222; }

        footer { text-align: center; padding: 120px; font-size: 0.7rem; opacity: 0.4; letter-spacing: 6px; background: #000; position: relative; z-index: 10; }
    </style>
</head>
<body>

    <section class="hero-wrapper">
        <div class="hero-bg" id="parallax-bg"></div>
        
        <div class="hero-content">
            <img src="./images/BLKHDZ.png" alt="BLKHDZ" class="hero-logo">
            
            <div class="hero-text-box">
                <div class="legacy-title">LEGACY ISN'T<br>BOUGHT.<br>IT'S BUILT.</div>
                <div class="legacy-sub">Precision for those who see the details others miss.</div>
            </div>
        </div>
    </section>

    <nav class="tabs">
        <button class="tab-btn active" onclick="showTab('lego-grid', this)">LEGO INVENTORY</button>
        <button class="tab-btn" onclick="showTab('diecast-grid', this)">DIECAST</button>
        <button class="tab-btn" onclick="showTab('tracker-grid', this)">LEGO TRACKER</button>
    </nav>

    <div class="container">
        <div id="lego-grid" class="grid active"></div>
        <div id="diecast-grid" class="grid"></div>
        <div id="tracker-grid" class="grid">
            <p style="text-align: center; width: 100%; color: var(--blk-red); letter-spacing: 5px;">ESTABLISHING MARKET UPLINK...</p>
        </div>
    </div>

    <footer>
        &copy; 2026 BLOCKHEADZ LLC. ALL RIGHTS RESERVED.<br><br>
        <strong>VETERAN OWNED</strong>
    </footer>

    <script>
        function showTab(gridId, btn) {
            document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(gridId).classList.add('active');
            btn.classList.add('active');
        }

        // DYNAMIC DRIFT
        window.addEventListener('scroll', function() {
            const parallax = document.getElementById('parallax-bg');
            let scrollPosition = window.pageYOffset;
            parallax.style.transform = 'translateY(' + (scrollPosition * 0.2) + 'px)';
        });

        async function loadData() {
            try {
                const res = await fetch('./data.json');
                const data = await res.json();
                document.getElementById('lego-grid').innerHTML = data.sets.map(set => `
                    <div class="card">
                        <img src="./images/${set.set_num}.jpg" class="card-img" onerror="this.src='./images/hero-parallax.jpg'">
                        <div style="padding:30px;">
                            <div style="color:var(--blk-red); font-size:0.75rem; margin-bottom:5px;">SET #${set.set_num}</div>
                            <div style="font-size:1.2rem; min-height:50px; line-height:1.3;">${set.name}</div>
                            <div class="market-val">$${set.market_value}</div>
                        </div>
                        <div class="shipping-info">
                            BOX: ${set.shipping_details.box_dimensions} | WT: ${set.shipping_details.weight_lbs} LBS
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.log("Sync in progress..."); }
        }
        window.onload = loadData;
    </script>
</body>
</html>
