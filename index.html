<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ LLC | LEGO Market Tracker</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('hero-parallax.jpg');
            background-size: cover;
            background-position: center;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        #lego-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .set-card {
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.3s;
        }
        .set-card:hover {
            transform: translateY(-5px);
            border-color: #FFD700;
        }
        .set-image {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .price-badge {
            background: #FFD700;
            color: #000;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            color: white;
        }
        .btn-ebay { background-color: #0064d2; }
        .btn-amazon { background-color: #ff9900; color: #000; }
        .btn-store { 
            display: block; 
            background-color: #e53238; 
            margin-top: 10px;
        }
        /* Mobile adjustments */
        @media (max-width: 600px) {
            .header { height: 200px; }
            .price-badge { font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1 style="color: #FFD700; font-size: 3rem; margin: 0;">BLKHDZ</h1>
    <p style="letter-spacing: 2px;">LIVE LEGO MARKET TRACKER</p>
</div>

<div class="container">
    <div id="lego-container">
        <p style="text-align: center; width: 100%;">Fetching latest market data...</p>
    </div>
</div>

<script>
    async function fetchLegoMarketData() {
        try {
            const response = await fetch('data.json');
            const sets = await response.json();
            const container = document.getElementById('lego-container');
            container.innerHTML = '';

            sets.forEach(set => {
                const cleanId = set.set_num.split('-')[0];
                const card = document.createElement('div');
                card.className = 'set-card';
                
                // eBay and Amazon search URLs with "LEGO" prefix
                const ebaySearch = `https://www.ebay.com/sch/i.html?_nkw=LEGO+${cleanId}`;
                const amazonSearch = `https://www.amazon.com/s?k=LEGO+${cleanId}`;
                const myStore = "https://www.ebay.com/str/blkhdz";

                card.innerHTML = `
                    <img src="${set.image_url}" class="set-image" alt="${set.name}">
                    <h2 style="margin: 0; font-size: 1.4rem;">${set.name}</h2>
                    <p style="color: #aaa; margin: 5px 0;">Set #${set.set_num} | ${set.year}</p>
                    
                    <p>Status: <span style="color: ${set.status === 'Market Active' ? '#00FF00' : '#FFD700'}">${set.status}</span></p>
                    
                    <div class="price-badge">
                        Avg Sold: $${set.ebay_avg_price}
                    </div>

                    <div class="button-group">
                        <a href="${ebaySearch}" target="_blank" class="btn btn-ebay">eBay</a>
                        <a href="${amazonSearch}" target="_blank" class="btn btn-amazon">Amazon</a>
                    </div>
                    
                    <a href="${myStore}" target="_blank" class="btn btn-store">View My eBay Store</a>
                `;
                container.appendChild(card);
            });
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('lego-container').innerHTML = 
                `<p style="color: red; text-align: center;">Error loading data. Check if data.json exists.</p>`;
        }
    }

    window.onload = fetchLegoMarketData;
</script>

</body>
</html>
