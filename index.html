<script>
    function createCard(item, categoryName) {
        const cleanId = item.set_num.split('-')[0];
        const amazonLink = `https://www.amazon.com/s?k=${categoryName}+${cleanId}`;
        const storeLink = `https://www.ebay.com/str/blkhdz?_nkw=${cleanId}`;
        
        // Formatting the price display
        const displayPrice = isNaN(item.ebay_avg_price) ? item.ebay_avg_price : `$${item.ebay_avg_price}`;

        return `
            <div class="set-card">
                <div class="price-badge">${displayPrice}</div>
                <div class="img-wrapper"><img src="${item.image_url}" alt="${item.name}" onerror="this.src='hero-parallax.jpg'"></div>
                <div class="card-content">
                    <div class="set-title">${item.name}</div>
                    <div class="btn-group">
                        <a href="${item.ebay_link}" target="_blank" class="action-link ebay-btn">Market Data</a>
                        <a href="${amazonLink}" target="_blank" class="action-link amazon-btn">Amazon</a>
                        <a href="${storeLink}" target="_blank" class="action-link store-btn">Acquire from BLKHDZ</a>
                    </div>
                </div>
            </div>`;
    }

    async function initMarket() {
        try {
            const [legoRes, diecastRes] = await Promise.all([
                fetch('data.json?v=' + Date.now()),
                fetch('diecast.json?v=' + Date.now())
            ]);
            
            if (!legoRes.ok || !diecastRes.ok) throw new Error("Syncing...");
            
            const legoData = await legoRes.json();
            const diecastData = await diecastRes.json();
            
            document.getElementById('inventory-grid').innerHTML = '';
            document.getElementById('watchlist-grid').innerHTML = '';
            document.getElementById('diecast-grid').innerHTML = '';

            legoData.forEach((item, index) => {
                if(index < 9) document.getElementById('inventory-grid').innerHTML += createCard(item, 'LEGO');
                else document.getElementById('watchlist-grid').innerHTML += createCard(item, 'LEGO');
            });

            diecastData.forEach(car => {
                document.getElementById('diecast-grid').innerHTML += createCard(car, 'Diecast');
            });
        } catch (e) {
            document.getElementById('inventory-grid').innerHTML = `<h3 style="grid-column:1/-1;text-align:center;color:var(--accent);">INITIALIZING MARKET DATA... REFRESH IN 60 SECONDS</h3>`;
        }
    }

    window.addEventListener('scroll', () => {
        const scrolled = window.pageYOffset;
        const bg = document.getElementById('parallax');
        if(bg) { bg.style.transform = `translateY(${scrolled * 0.3}px)`; }
    });
    window.onload = initMarket;
</script>
