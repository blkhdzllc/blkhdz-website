<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ LLC | Elite Market Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --blk-red: #ff0000; --blk-bg: #000000; --blk-card: #111111; }
        body { margin: 0; background-color: var(--blk-bg); color: #fff; font-family: 'Syncopate', sans-serif; overflow-x: hidden; }
        
        /* Hero Section - Using your new naming convention */
        .hero { 
            position: relative;
            height: 60vh; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: #000;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                              url('./images/hero-parallax.jpg');
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid var(--blk-red);
        }
        
        /* Your Title Image */
        .logo { z-index: 10; max-width: 350px; height: auto; margin-bottom: 20px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .section-header { border-left: 4px solid var(--blk-red); padding-left: 15px; margin-bottom: 40px; letter-spacing: 5px; text-transform: uppercase; }

        .card { background: var(--blk-card); border: 1px solid #222; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--blk-red); transform: translateY(-5px); }
        .card-img { width: 100%; height: 220px; object-fit: cover; border-bottom: 1px solid #222; }
        .card-body { padding: 20px; }
        .market-val { font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
        
        .shipping-info { 
            background: #000; padding: 12px; font-family: sans-serif; font-size: 0.75rem; color: #888; border-top: 1px solid #333;
        }

        footer { text-align: center; padding: 60px; font-size: 0.7rem; border-top: 1px solid #111; opacity: 0.7; letter-spacing: 2px; }
    </style>
</head>
<body>

    <header class="hero">
        <img src="./images/BLKHDZ.png" alt="BLKHDZ LLC" class="logo">
        <div style="letter-spacing: 8px; color: var(--blk-red); font-size: 0.8rem;">ELITE MARKET TRACKER</div>
    </header>

    <div class="container">
        <h2 class="section-header">Lego Portfolio</h2>
        <div id="portfolio-grid" class="grid">
            <p>Syncing Live Inventory...</p>
        </div>
    </div>

    <footer>
        &copy; 2026 BLOCKHEADZ LLC. ALL RIGHTS RESERVED.<br>
        <strong>Veteran Owned</strong>
    </footer>

    <script>
        async function syncData() {
            const grid = document.getElementById('portfolio-grid');
            try {
                const response = await fetch('./data.json');
                const data = await response.json();
                
                // This maps the image names to the set numbers automatically
                grid.innerHTML = data.sets.map(set => `
                    <div class="card">
                        <img src="./images/${set.set_num}.jpg" class="card-img" alt="${set.name}" onerror="this.src='./images/hero-parallax.jpg'">
                        <div class="card-body">
                            <div style="color:red; font-size:0.7rem;">SET #${set.set_num}</div>
                            <div style="font-size:0.9rem; margin:10px 0;">${set.name}</div>
                            <div class="market-val">$${set.market_value}</div>
                            <div class="shipping-info">
                                <strong>SHIPPING:</strong> ${set.shipping_details.box_dimensions} | ${set.shipping_details.weight_lbs} LBS
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) { 
                grid.innerHTML = "<p>OFFLINE: DATA SOURCE UNREACHABLE</p>"; 
            }
        }
        window.onload = syncData;
    </script>
</body>
</html>
