name: Manual Market Test & Sandbox Sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Pre-Sync and Execute
        working-directory: data
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CERT_ID: ${{ secrets.CERT_ID }}
        run: |
          # 1. Initialize Bot and Sync with Main BEFORE generating new data
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          
          # 2. Execute the cleaned script (Ensuring data/test/ exists)
          mkdir -p test
          python sync_test.py

      - name: Secure Commit and Push
        run: |
          # 3. Add only the updated JSON files
          git add data/test/*.json
          
          # 4. Commit and push (The '|| true' prevents failure if no data changed)
          git commit -m "Sandbox Sync: Clean Inventory Update" || true
          git push origin main
