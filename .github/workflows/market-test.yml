name: Manual Market Test & Sandbox Sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # CRITICAL: Fetches full history to stop Error 128

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Execute Sandbox Inventory Sync
        working-directory: data
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CERT_ID: ${{ secrets.CERT_ID }}
        run: |
          mkdir -p test
          python sync_test.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force sync before pushing
          git pull origin main --rebase
          
          git add data/test/*.json
          git commit -m "Sandbox Sync: Updated Inventory" || echo "No changes to commit"
          git push origin main
