name: Manual Market Test & Sandbox Sync

on:
  workflow_dispatch:

permissions:
  contents: write  # CRITICAL: This allows the bot to save the JSON files

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Pre-Sync and Execute
        working-directory: data
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CERT_ID: ${{ secrets.CERT_ID }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          
          # Ensure the test directory exists before running script
          mkdir -p test
          python sync_test.py

      - name: Secure Commit and Push
        run: |
          git add data/test/*.json
          git commit -m "Sandbox Sync: PowerBuild Format Update" || true
          git push origin main
