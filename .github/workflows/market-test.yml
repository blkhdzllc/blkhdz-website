name: Manual Market Test & Sandbox Sync

on:
  workflow_dispatch: # Adds the manual button in Actions tab

# NPW Fix: Explicitly grant Write permission to fix Exit Code 128
permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Execute Market Scraper
        # Updates research data in test/results/
        run: python test/test_brickeconomy.py

      - name: Execute Sandbox Inventory Sync
        # Creates the dynamic data/test/inventory.json
        working-directory: data
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CERT_ID: ${{ secrets.CERT_ID }}
        run: python sync_test.py

      - name: Commit All Sandbox Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # NPW: Stage both research results and sandbox inventory
          git add test/results/*
          git add data/test/*.json
          
          git commit -m "Updated Sandbox Data and Market Results [Manual Run]" || echo "No changes"
          git push
