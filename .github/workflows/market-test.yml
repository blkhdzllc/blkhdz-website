name: Manual Market Test & Sandbox Sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Pre-Sync and Execute
        working-directory: data
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CERT_ID: ${{ secrets.CERT_ID }}
        run: |
          # 1. Clear the path BEFORE creating files
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          
          # 2. Now create the data
          mkdir -p test
          python sync_test.py

      - name: Secure Commit and Push
        run: |
          # 3. Save only the new data
          git add data/test/*.json
          
          # The '|| true' prevents a crash if the data hasn't changed
          git commit -m "Sandbox Sync: Updated Inventory" || true
          
          # 4. Final push
          git push origin main
