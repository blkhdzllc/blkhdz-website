name: Manual Market Test and Production Sync

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Execute Full Inventory Sync
      env:
        APP_ID: ${{ secrets.APP_ID }}
        CERT_ID: ${{ secrets.CERT_ID }}
      run: python data/sync_test.py

    - name: Commit Production Data to Live Site
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/inventory.json data/diecast.json
        git commit -m "Production Update: Syncing all active inventory items" || echo "No changes to commit"
        git push origin main
