name: Update LEGO Prices

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Clears the Node.js 20 warning

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # Updated version

    - name: Set up Python
      uses: actions/setup-python@v5 # Updated version
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run tracker script
      env:
        SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
      run: python tracker.py

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update market data"
        git push
