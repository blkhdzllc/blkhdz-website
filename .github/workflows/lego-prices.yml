name: Update Market Prices

on:
  schedule:
    - cron: '0 */18 * * *' # Runs every 18 hours
  workflow_dispatch:      # Allows you to run it manually

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Market Tracker
        env:
          SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
        run: python tracker.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json diecast.json
          # Only commit if there are actual changes to the data
          git diff --quiet && git diff --staged --quiet || (git commit -m "Price Update: $(date)" && git push origin main)

      # This step explicitly tells GitHub Pages to deploy the new files
      - name: Trigger GitHub Pages Deploy
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
