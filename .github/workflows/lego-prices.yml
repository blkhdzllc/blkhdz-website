name: Update BLKHDZ Inventory

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests

      - name: Sync Diecast Inventory
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CERT_ID: ${{ secrets.CERT_ID }}
        run: python data/sync_diecast.py

      - name: Sync LEGO Inventory
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CERT_ID: ${{ secrets.CERT_ID }}
        run: python data/sync_inventory.py

      - name: Generate Sitemap
        run: python generate_sitemap.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated Inventory & Sitemap Sync" || echo "No changes to commit"
          git push
