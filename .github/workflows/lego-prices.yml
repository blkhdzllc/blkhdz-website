name: Update BLKHDZ Inventory

on:
  workflow_dispatch: # Allows manual run
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run LEGO Sync
        working-directory: data
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CERT_ID: ${{ secrets.CERT_ID }}
        run: python sync_inventory.py

      - name: Run Diecast Sync
        working-directory: data
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CERT_ID: ${{ secrets.CERT_ID }}
        run: python sync_diecast.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brick-collection/* data/diecast/*
          git commit -m "Automated Inventory Sync" || echo "No changes to commit"
          git push
