name: Update LEGO Prices
on:
  schedule:
  # This runs at 00:00, 06:00, 12:00, and 18:00 UTC
    # (Approx. 7pm, 1am, 7am, 1pm EST)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # This keeps the "Run manually" button active
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script
        env:
          REBRICKABLE_KEY: ${{ secrets.REBRICKABLE_KEY }}
        run: python tracker.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data.json
          git commit -m "Updated LEGO data" || exit 0
          git push
