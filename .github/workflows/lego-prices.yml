name: Update BLKHDZ Inventory

# MANUAL CONTROL ONLY - No automatic triggers to overwrite your work
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual update'
        required: false
        default: 'Manual Price Sync'

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any scraping dependencies here if you re-enable them later
          # pip install requests beautifulsoup4

      - name: Execute Tracker Script
        run: python tracker.py

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name 'BLKHDZ-Inventory-Bot'
          git config --global user.email 'bot@blkhdz.com'
          git add data.json
          # Only commit if data.json actually changed to avoid empty commit errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Manual Update: Syncing Prices [10 Sets]" && git push)
