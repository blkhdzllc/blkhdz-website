name: Update Market Prices

on:
  schedule:
    - cron: '0 */18 * * *' # Triggers every 18 hours (The Efficiency Sweet Spot)
  workflow_dispatch:      # Allows for manual "One-Click" updates

# Prevents multiple runs from overlapping and wasting API credits
concurrency:
  group: market-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15    # Safety shutoff to prevent hung processes
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Market Tracker
        env:
          SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
        run: python tracker.py

      - name: Commit and Push Data Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json diecast.json
          # Only commits if there are actual price changes to save on build logs
          git commit -m "Automated Market Update: $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push origin main
