name: BLKHDZ Market Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:      # Allows you to run it manually
  push:
    branches:
      - main               # Runs whenever you push code to the main branch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Market Tracker
      env:
        SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
      run: python tracker.py

    - name: Force Update and Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Create a timestamp so there is ALWAYS a change to commit
        echo "Last Sync: $(date)" > sync_log.txt
        
        git add data.json sync_log.txt
        git commit -m "Automated Market Update: $(date)" || exit 0
        git push origin main
