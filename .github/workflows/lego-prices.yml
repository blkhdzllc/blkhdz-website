name: Update BLKHDZ Inventory

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run LEGO Tracker
      env:
        SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
      run: python tracker.py

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        # Track LEGO data, Diecast data, and the Node 24 metadata
        git add data.json diecast.json package.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update Market Values (LEGO & Diecast)"
        git push
