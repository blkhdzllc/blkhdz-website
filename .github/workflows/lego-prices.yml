name: BLKHDZ Market Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Market Tracker
      env:
        SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
      run: |
        ls -R # Diagnostic: Shows us your file structure in the logs
        python tracker.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git commit -m "Sync: W15 Mercedes Update" || exit 0
        git push
