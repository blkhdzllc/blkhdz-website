import os
import requests
from bs4 import BeautifulSoup
import smtplib
from email.mime.text import MIMEText
from email.mime.multipart import MIMEMultipart

# Configuration & Secrets (Loaded from GitHub Environment)
SCRAPE_DO_TOKEN = os.getenv("SCRAPE_DO_TOKEN")
# Make sure you have added GMAIL_USER and GMAIL_APP_PASSWORD as GitHub Secrets if using Gmail
EMAIL_USER = os.getenv("GMAIL_USER") 
EMAIL_PASS = os.getenv("GMAIL_APP_PASSWORD")
RECIPIENT_EMAIL = os.getenv("GMAIL_USER") # Sends to yourself

TARGET_URL = "https://www.walmart.com/ip/your-target-item-link" # Replace with your product URL

def send_email(subject, body):
    """Sends an email notification."""
    if not EMAIL_USER or not EMAIL_PASS:
        print("Email credentials not configured in environment secrets.")
        return
    
    try:
        msg = MIMEMultipart()
        msg['From'] = EMAIL_USER
        msg['To'] = RECIPIENT_EMAIL
        msg['Subject'] = subject
        
        msg.attach(MIMEText(body, 'plain'))
        
        # Example using Gmail SMTP
        server = smtplib.SMTP('smtp.gmail.com', 587)
        server.starttls()
        server.login(EMAIL_USER, EMAIL_PASS)
        server.send_message(msg)
        server.quit()
        print("Email notification sent successfully!")
    except Exception as e:
        print(f"Failed to send email: {e}")

def send_test_email():
    """Forces a test notification email for pipeline verification."""
    print("Triggering test email...")
    send_email(
        subject="[TEST] Walmart Tracker Pipeline Verified", 
        body="This is a test notification confirming that GitHub Actions and email routing are working correctly."
    )

