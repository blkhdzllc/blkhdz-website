<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ LLC | Premium Collector Sourcing</title>
    <style>
        :root { --accent: #00ff41; --bg: #0a0a0a; --card: #161616; --border: #333; }
        body { background-color: var(--bg); color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; letter-spacing: 2px; cursor: pointer; color: var(--accent); font-size: 1.5rem; }
        button { background: #222; color: white; border: 1px solid #444; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; cursor: pointer; transition: 0.2s; height: 100%; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .card-img { width: 100%; height: 220px; object-fit: contain; background: #000; border-bottom: 1px solid var(--border); }
        .card-body { padding: 15px; flex-grow: 1; }
        .price { color: var(--accent); font-weight: bold; font-size: 1.3rem; margin: 10px 0; }
        .product-page { display: none; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 20px; }
        .gallery-main { width: 100%; border-radius: 8px; border: 1px solid var(--border); height: 450px; object-fit: contain; background: #000; }
        .thumb-strip { display: flex; gap: 10px; margin-top: 15px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; scrollbar-color: var(--accent) #111; }
        .thumb { width: 80px; height: 80px; object-fit: cover; cursor: pointer; border: 2px solid transparent; border-radius: 4px; flex-shrink: 0; }
        .thumb:hover { border-color: var(--accent); }
        .buy-btn { background: var(--accent); color: #000; width: 100%; padding: 20px; text-align: center; text-decoration: none; display: block; border-radius: 8px; font-weight: bold; margin: 20px 0; }
        .description-box { background: #111; border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-top: 20px; color: #ccc; font-size: 0.95rem; line-height: 1.6; overflow-x: auto; min-height: 400px; }
        .description-box img { max-width: 100%; height: auto; }
        .disclosure { margin-top: 30px; font-size: 0.7rem; color: #555; text-align: center; line-height: 1.4; border-top: 1px solid var(--border); padding-top: 20px; }
        @media (max-width: 768px) { .product-page { grid-template-columns: 1fr; } .gallery-main { height: 300px; } }
    </style>
</head>
<body>
<div class="container">
    <header class="header">
        <div class="logo" onclick="location.reload()">BLKHDZ LLC</div>
        <div id="nav-btns">
            <button onclick="loadCategory('LEGO')" id="btn-LEGO">LEGO</button>
            <button onclick="loadCategory('DIECAST')" id="btn-DIECAST" style="margin-left:10px;">DIECAST</button>
        </div>
    </header>
    <main id="inventory-grid" class="grid"></main>
    <main id="product-detail" class="product-page"></main>
</div>
<script>
    let currentData = [];
    async function loadCategory(cat) {
        const grid = document.getElementById('inventory-grid');
        const detail = document.getElementById('product-detail');
        grid.style.display = 'grid'; detail.style.display = 'none';
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${cat}`).classList.add('active');
        
        try {
            const response = await fetch(`./data/test/${cat === 'LEGO' ? 'inventory.json' : 'diecast.json'}?t=${Date.now()}`);
            const data = await response.json();
            currentData = data.itemSummaries || [];
            grid.innerHTML = currentData.map((item, index) => `
                <div class="card" onclick="showProduct(${index})">
                    <img src="${item.customGallery[0] || './images/hero-parallax.jpg'}" class="card-img" onerror="this.src='./images/hero-parallax.jpg'">
                    <div class="card-body">
                        <div style="font-weight:bold; height: 2.8em; overflow: hidden;">${item.title}</div>
                        <div class="price">$${item.price.value}</div>
                        <div style="font-size: 0.7rem; color: #666;">View Gallery & Details</div>
                    </div>
                </div>
            `).join('');
        } catch (e) { grid.innerHTML = '<div style="text-align:center; padding:50px;">Run manual sync to load items.</div>'; }
    }

    function showProduct(index) {
        const item = currentData[index];
        const grid = document.getElementById('inventory-grid');
        const detail = document.getElementById('product-detail');
        grid.style.display = 'none'; detail.style.display = 'grid';
        
        const galleryHtml = (item.customGallery || []).map(img => `
            <img src="${img}" class="thumb" onclick="document.getElementById('main-img').src='${img}'" onerror="this.style.display='none'">
        `).join('');

        detail.innerHTML = `
            <div class="gallery">
                <img src="${item.customGallery[0]}" id="main-img" class="gallery-main" onerror="this.src='./images/hero-parallax.jpg'">
                <div class="thumb-strip">${galleryHtml}</div>
                <div class="description-box">
                    <h3 style="color: var(--accent); margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px;">PRODUCT SPECIFICATIONS</h3>
                    ${item.fullHtmlDescription || 'Detailed specifications and high-resolution videos available on the eBay storefront.'}
                </div>
            </div>
            <div class="info">
                <button onclick="location.reload()" style="background:none; border:none; color:var(--accent); padding:0; margin-bottom: 20px; cursor:pointer;">← Back to Collection</button>
                <h2>${item.title}</h2>
                <div class="price">$${item.price.value}</div>
                <a href="${item.itemWebUrl}" target="_blank" class="buy-btn">PURCHASE ON EBAY</a>
                <p style="font-size: 0.8rem; color: #888;">USAF Veteran Owned & Operated. Based in Tampa, FL.</p>
                <div class="disclosure">
                    <strong>Affiliate Disclosure:</strong> Links on this site are affiliate links. As an eBay Partner, BLKHDZ LLC may earn a commission from qualifying purchases made via these links. This supports our sourcing operations at no extra cost to you.
                </div>
            </div>
        `;
    }
    window.onload = () => loadCategory('LEGO');
</script>
</body>
</html>
