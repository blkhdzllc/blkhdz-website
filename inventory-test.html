<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockheadz LLC | Active Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --accent-blue: #00d4ff;
            --card-bg: #161616;
            --text-main: #ffffff;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h2 {
            font-family: 'Syncopate', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-left: 4px solid var(--accent-blue);
            padding-left: 15px;
            margin-bottom: 40px;
        }
        #inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .product-card:hover { transform: translateY(-5px); border-color: var(--accent-blue); }
        .image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }
        .details { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .title { font-size: 0.9rem; font-weight: 600; margin-bottom: 15px; height: 40px; overflow: hidden; line-height: 1.4; }
        .price { font-family: 'Syncopate', sans-serif; color: var(--accent-blue); font-size: 1.2rem; margin-bottom: 20px; }
        .buy-button {
            background: transparent;
            color: white;
            border: 1px solid var(--accent-blue);
            padding: 12px;
            text-align: center;
            text-decoration: none;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .buy-button:hover { background: var(--accent-blue); color: black; }
        footer { margin-top: 60px; text-align: center; font-size: 0.8rem; color: #666; border-top: 1px solid #222; padding-top: 20px; }
        footer a { color: var(--accent-blue); text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Active Inventory</h2>
    <div id="inventory-grid">
        <p>Loading Blockheadz LLC Inventory...</p>
    </div>
    <footer>
        Veteran Owned Business<br><br>
        <a href="https://www.ebay.com/str/blkhdz" target="_blank">Visit our eBay Store</a>
    </footer>
</div>

<script>
    // Exact path to the eBay API file
    const dataUrl = 'data/test/inventory.json'; 

    async function loadInventory() {
        try {
            // The ?t= prevents your browser from using the old cached error
            const response = await fetch(dataUrl + '?t=' + new Date().getTime());
            const data = await response.json();
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = ''; 

            if (!data.itemSummaries || data.itemSummaries.length === 0) {
                grid.innerHTML = '<p>No active listings found in the file.</p>';
                return;
            }

            data.itemSummaries.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const imageUrl = item.image ? item.image.imageUrl : 'https://via.placeholder.com/300?text=No+Image';
                const price = item.price ? `${item.price.currency} $${item.price.value}` : 'Contact for Price';
                const affiliateLink = item.itemAffiliateWebUrl || item.itemWebUrl;

                card.innerHTML = `
                    <div class="image-container">
                        <img src="${imageUrl}" alt="Product Image">
                    </div>
                    <div class="details">
                        <div class="title">${item.title}</div>
                        <div class="price">${price}</div>
                        <a href="${affiliateLink}" target="_blank" class="buy-button">View on eBay</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            document.getElementById('inventory-grid').innerHTML = '<p>Waiting for GitHub to publish the data/test/inventory.json file...</p>';
        }
    }

    loadInventory();
</script>

</body>
</html>
