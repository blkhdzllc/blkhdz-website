<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ | Staging - PowerBuild Visual Upgrade</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        :root { 
            --blk-red: #ff0000; 
            --blk-bg: #0b0b0b; 
            --blk-card: #151515; 
            --blk-teal: #008080; 
        }
        
        body { margin: 0; background-color: var(--blk-bg); color: #fff; font-family: 'Archivo Black', sans-serif; }

        /* SANDBOX WARNING HEADER */
        .sandbox-banner {
            background: var(--blk-red);
            color: white;
            text-align: center;
            padding: 5px;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        /* HERO SLIDESHOW SECTION */
        .slideshow {
            position: relative;
            height: 60vh;
            background: #000;
            overflow: hidden;
            border-bottom: 4px solid var(--blk-red);
        }

        .slide {
            position: absolute;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        .slide.active { opacity: 1; }

        .hero-content {
            position: absolute;
            bottom: 40px; left: 5%;
            z-index: 10;
        }

        /* NAVIGATION */
        .market-nav {
            display: flex;
            justify-content: center;
            background: #000;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid #222;
        }

        .nav-btn {
            padding: 20px;
            background: none; border: none;
            color: #555; font-family: 'Archivo Black', sans-serif;
            cursor: pointer; transition: 0.3s;
        }

        .nav-btn.active { color: var(--blk-red); border-bottom: 3px solid var(--blk-red); }
        .nav-btn span { display: block; font-size: 0.6rem; color: #ffd700; }

        /* GRID */
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }

        .card { 
            background: var(--blk-card); 
            border: 1px solid #222;
            transition: 0.3s;
        }
        .card:hover { border-color: var(--blk-red); transform: translateY(-5px); }
        .card-img { width: 100%; height: 250px; object-fit: contain; background: #000; }
        .card-body { padding: 15px; }
        .price { color: var(--blk-red); font-size: 1.2rem; }

        footer { text-align: center; padding: 50px; background: #050505; color: #444; }
    </style>
</head>
<body>

    <div class="sandbox-banner">STAGING ENVIRONMENT - TESTING VISUAL UPGRADE v2.0</div>

    <section class="slideshow">
        <div class="slide active" style="background-image: url('./images/hero-parallax.jpg');"></div>
        <div class="slide" style="background-image: url('./images/diecast-showcase.jpg');"></div>
        
        <div class="hero-content">
            <img src="./images/BLKHDZ.png" style="width: 300px;">
        </div>
    </section>

    <nav class="market-nav">
        <button class="nav-btn active" onclick="load('inventory.json', this)">BRICK COLLECTION</button>
        <button class="nav-btn" onclick="load('diecast.json', this)">DIECAST CARS</button>
        <button class="nav-btn" style="opacity: 0.5; cursor: not-allowed;">COLORING<span>COMING SOON</span></button>
    </nav>

    <div class="container">
        <div id="market-grid" class="grid">
            </div>
    </div>

    <footer>
        <div style="letter-spacing: 3px; color: var(--blk-teal);">VETERAN OWNED</div>
    </footer>

    <script>
        // Slideshow logic
        let current = 0;
        const slides = document.querySelectorAll('.slide');
        setInterval(() => {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
        }, 5000);

        async function load(file, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const grid = document.getElementById('market-grid');
            grid.innerHTML = '<p>FETCHING SANDBOX DATA...</p>';

            try {
                // NPW: Point specifically to your TEST data folder
                const response = await fetch('data/test/' + file + '?v=' + Date.now());
                const data = await response.json();
                const items = data.itemSummaries || [];

                grid.innerHTML = items.map(item => `
                    <div class="card">
                        <img src="${item.image?.imageUrl || './images/hero-parallax.jpg'}" class="card-img">
                        <div class="card-body">
                            <div style="font-size: 0.8rem; height: 3em;">${item.title}</div>
                            <div class="price">$${item.price.value}</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                grid.innerHTML = '<p>Error: Run "Manual Market Test" to generate sandbox JSON files.</p>';
            }
        }
        window.onload = () => load('inventory.json', document.querySelector('.nav-btn.active'));
    </script>
</body>
</html>
