<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockheadz LLC | Live Inventory Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --accent-blue: #00d4ff;
            --card-bg: #161616;
            --text-main: #ffffff;
            --ebay-orange: #e53238;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            font-family: 'Syncopate', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-left: 4px solid var(--accent-blue);
            padding-left: 15px;
            margin-bottom: 40px;
        }

        /* The Grid System */
        #inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Product Card - "Elite" Style */
        .product-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
        }

        .image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .details {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            height: 40px;
            overflow: hidden;
            line-height: 1.4;
        }

        .price {
            font-family: 'Syncopate', sans-serif;
            color: var(--accent-blue);
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .buy-button {
            background: transparent;
            color: white;
            border: 1px solid var(--accent-blue);
            padding: 12px;
            text-align: center;
            text-decoration: none;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .buy-button:hover {
            background: var(--accent-blue);
            color: black;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid #222;
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Active Inventory</h2>
    <div id="inventory-grid">
        <p>Loading Blockheadz LLC Inventory...</p>
    </div>

    <footer>
        Veteran Owned Business
    </footer>
</div>

<script>
    // Point this to your actual JSON file location in your repo
    const dataUrl = 'inventory.json'; 

    async function loadInventory() {
        try {
            const response = await fetch(dataUrl);
            const data = await response.json();
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = ''; // Clear loading text

            if (!data.itemSummaries || data.itemSummaries.length === 0) {
                grid.innerHTML = '<p>No active listings found.</p>';
                return;
            }

            data.itemSummaries.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                // Fallback for images if missing
                const imageUrl = item.image ? item.image.imageUrl : 'https://via.placeholder.com/300?text=No+Image';
                const price = item.price ? `${item.price.currency} $${item.price.value}` : 'Contact for Price';
                
                // Using your Affiliate Link specifically
                const affiliateLink = item.itemAffiliateWebUrl || item.itemWebUrl;

                card.innerHTML = `
                    <div class="image-container">
                        <img src="${imageUrl}" alt="${item.title}">
                    </div>
                    <div class="details">
                        <div class="title">${item.title}</div>
                        <div class="price">${price}</div>
                        <a href="${affiliateLink}" target="_blank" class="buy-button">View on eBay</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            console.error('Error loading inventory:', error);
            document.getElementById('inventory-grid').innerHTML = '<p>Error syncing with eBay. Check back soon.</p>';
        }
    }

    loadInventory();
</script>

</body>
</html>
