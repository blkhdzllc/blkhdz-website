<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockheadz LLC - Live Inventory Test</title>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; border-bottom: 2px solid #ffd700; padding-bottom: 20px; }
        h1 { color: #ffd700; text-transform: uppercase; letter-spacing: 2px; }
        .tab-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .tab-btn { padding: 12px 30px; font-size: 1rem; font-weight: bold; text-transform: uppercase; cursor: pointer; border: 2px solid transparent; border-radius: 5px; transition: 0.3s; }
        .lego-btn { background: #ffd700; color: #000; }
        .lego-btn:hover { background: #fff; border-color: #ffd700; }
        .diecast-btn { background: #e60000; color: #fff; }
        .diecast-btn:hover { background: #ff4d4d; border-color: #fff; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .product-card { background: #1a1f29; border: 1px solid #333; border-radius: 10px; overflow: hidden; transition: transform 0.2s; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-5px); border-color: #ffd700; }
        .image-container { width: 100%; height: 200px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .image-container img { width: 100%; height: 100%; object-fit: contain; }
        .details { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .title { font-size: 0.95rem; margin-bottom: 10px; color: #eee; line-height: 1.4; height: 40px; overflow: hidden; }
        .price { font-size: 1.2rem; font-weight: bold; color: #ffd700; margin-bottom: 15px; }
        .buy-button { display: block; background: #007bff; color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .buy-button:hover { background: #0056b3; }
        footer { text-align: center; margin-top: 50px; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>

<header>
    <h1>Blockheadz LLC</h1>
    <p>Live Inventory Feed</p>
</header>

<div class="tab-container">
    <button class="tab-btn lego-btn" onclick="loadInventory('inventory.json')">LEGO Sets</button>
    <button class="tab-btn diecast-btn" onclick="loadInventory('diecast.json')">Diecast Cars</button>
</div>

<div id="inventory-grid" class="grid-container"></div>

<footer>
    <p>&copy; 2026 Blockheadz LLC. All Rights Reserved.</p>
    <p><strong>Veteran Owned Business</strong></p>
</footer>

<script>
    async function loadInventory(fileName) {
        const grid = document.getElementById('inventory-grid');
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px;"><p style="color: #ffd700;">Scanning Database for ' + fileName + '...</p></div>';

        try {
            const response = await fetch('data/test/' + fileName + '?t=' + new Date().getTime());
            if (!response.ok) throw new Error('File not found');
            const data = await response.json();
            grid.innerHTML = ''; 
            const items = data.itemSummaries || [];

            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px;"><p>No active ' + fileName.split('.')[0] + ' listings found.</p></div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const imageUrl = (item.image && item.image.imageUrl) ? item.image.imageUrl : 'https://via.placeholder.com/300?text=No+Image';
                const priceValue = item.price ? `$${parseFloat(item.price.value).toFixed(2)}` : 'View Item';
                const title = item.title || 'Untitled Item';
                
                // USES AFFILIATE LINK FIRST, THEN FALLS BACK TO REGULAR URL
                const ebayLink = item.itemAffiliateWebUrl || item.itemWebUrl;

                card.innerHTML = `
                    <div class="image-container">
                        <img src="${imageUrl}" alt="${title}">
                    </div>
                    <div class="details">
                        <div class="title">${title}</div>
                        <div class="price">${priceValue}</div>
                        <a href="${ebayLink}" target="_blank" class="buy-button">View on eBay</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            console.error('Error:', error);
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px;"><p style="color: #ff4444;">Error loading ' + fileName + '.</p></div>';
        }
    }
    loadInventory('inventory.json');
</script>
</body>
</html>
