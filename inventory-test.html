<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ Sandbox | Inventory Test</title>
    <style>
        body { background-color: #0a0a0a; color: #e0e0e0; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .hero { width: 100%; height: 250px; background: #111 url('./images/hero-parallax.jpg') center/cover no-repeat; border: 1px solid #333; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: #161616; border: 1px solid #333; border-radius: 4px; overflow: hidden; transition: 0.2s; height: 100%; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); border-color: #00ff41; }
        .card-img { width: 100%; height: 220px; object-fit: cover; border-bottom: 1px solid #333; }
        .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .price { color: #00ff41; font-weight: bold; font-size: 1.3rem; margin: 10px 0; }
        .title-text { font-size: 0.95rem; font-weight: 500; height: 2.8em; overflow: hidden; line-height: 1.4; color: #fff; }
        button { background: #222; color: white; border: 1px solid #444; padding: 10px 25px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button.active { background: #00ff41; color: #000; border-color: #00ff41; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>BLOCKHEADZ <span style="color: #666; font-size: 1.1rem;">SANDBOX v2.0</span></h1>
        <div class="btn-group">
            <button onclick="loadCategory('LEGO')" id="btn-LEGO">LEGO</button>
            <button onclick="loadCategory('DIECAST')" id="btn-DIECAST" style="margin-left:10px;">DIECAST</button>
        </div>
    </div>

    <div class="hero">
        <h2 style="background: rgba(0,0,0,0.8); padding: 15px 30px; border: 1px solid #444; letter-spacing: 2px;">LIVE INVENTORY</h2>
    </div>

    <div id="inventory-grid" class="grid"></div>
</div>

<script>
    async function loadCategory(cat) {
        const grid = document.getElementById('inventory-grid');
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${cat}`).classList.add('active');
        
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; color:#666;">Synchronizing with eBay...</div>';
        
        const path = `./data/test/${cat === 'LEGO' ? 'inventory.json' : 'diecast.json'}`;
        try {
            const response = await fetch(`${path}?t=${new Date().getTime()}`);
            if (!response.ok) throw new Error('Refresh required.');
            const data = await response.json();
            const items = data.itemSummaries || [];

            grid.innerHTML = items.map(item => `
                <a href="${item.itemWebUrl}" target="_blank" style="text-decoration: none; color: inherit;">
                    <div class="card">
                        <img src="${item.image?.imageUrl || './images/hero-parallax.jpg'}" class="card-img" onerror="this.src='./images/hero-parallax.jpg'">
                        <div class="card-body">
                            <div class="title-text">${item.title}</div>
                            <div class="price">$${item.price.value}</div>
                            <div style="font-size: 0.75rem; color: #666; margin-top: auto;">Click to view photos & details on eBay</div>
                        </div>
                    </div>
                </a>
            `).join('');
        } catch (e) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #ff4444;">Status: Run Manual Market Test to refresh data.</div>`;
        }
    }
    window.onload = () => loadCategory('LEGO');
</script>
</body>
</html>
