<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKHDZ Sandbox | Inventory Test</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: #161616;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #555;
        }
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #333;
        }
        .card-body {
            padding: 15px;
        }
        .price {
            color: #00ff41;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .btn-group {
            margin-bottom: 20px;
        }
        button {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 10px 20px;
            cursor: pointer;
            margin-right: 10px;
            border-radius: 4px;
        }
        button:hover {
            background: #333;
        }
        button.active {
            background: #444;
            border-color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>BLOCKHEADZ <span style="color: #666; font-size: 1.2rem;">SANDBOX v2.0</span></h1>
        <div class="btn-group">
            <button onclick="loadCategory('LEGO')" id="btn-LEGO">LEGO</button>
            <button onclick="loadCategory('DIECAST')" id="btn-DIECAST">DIECAST</button>
        </div>
    </div>

    <div id="inventory-grid" class="grid">
        <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #666;">
            Select a category to load real-time eBay data...
        </div>
    </div>
</div>

<script>
    async function loadCategory(cat) {
        const grid = document.getElementById('inventory-grid');
        const buttons = document.querySelectorAll('button');
        
        // UI Reset
        buttons.forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${cat}`).classList.add('active');
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px;">Loading Live Data...</div>';

        // Set path based on selection
        const path = cat === 'LEGO' ? 'data/test/inventory.json' : 'data/test/diecast.json';

        try {
            const response = await fetch(path);
            if (!response.ok) throw new Error('Data file not found. Run Manual Market Test first.');
            
            const data = await response.json();
            const items = data.itemSummaries || [];

            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px;">No active items found in this category.</div>';
                return;
            }

            // Build the Active Cards
            grid.innerHTML = items.map(item => {
                const itemLink = item.itemWebUrl || '#';
                const itemImg = item.image?.imageUrl || './images/hero-parallax.jpg';
                const itemPrice = item.price ? item.price.value : 'N/A';
                const itemDesc = item.shortDescription || 'Collector Grade Item. Shipped in reinforced boxes with professional dunnage.';

                return `
                    <a href="${itemLink}" target="_blank" style="text-decoration: none; color: inherit;">
                        <div class="card">
                            <img src="${itemImg}" class="card-img" onerror="this.src='./images/hero-parallax.jpg'">
                            <div class="card-body">
                                <div style="font-size: 0.9rem; margin-bottom: 10px; line-height: 1.2; height: 2.4em; overflow: hidden;">
                                    ${item.title}
                                </div>
                                <div class="price">$${itemPrice}</div>
                                <div style="font-size: 0.65rem; color: #888; margin-top: 10px; font-family: sans-serif; line-height: 1.3;">
                                    ${itemDesc}
                                </div>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');

        } catch (error) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #ff4444;">Error: ${error.message}</div>`;
        }
    }
</script>

</body>
</html>
